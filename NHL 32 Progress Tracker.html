PP:['Power play %',`When the other team takes a penalty, your team plays with an extra skater (usually 5 on 4) for 2 minutes or until you score. Power play % is how often those chances end in a goal. 20% is average and 25% or more is elite.`],
PK:['Penalty kill %',`When your team takes a penalty, it plays a skater short. Penalty kill % is how often it stops the other team from scoring in that time. About 80% is average and 83% or more is elite.`],
SV:['Save percentage',`The share of shots on goal that the goalie stops. .905 is about average and .915 or better is excellent. Here it covers whoever played in net for the team.`],
SF:['Shots per game',`Shots on goal the team takes each game. More shots usually means more time in the attacking zone and more chances to score.`],
PIM:['Penalty minutes per game',`Minutes a team spends in the penalty box each game. Fewer is better: a disciplined team gives opponents fewer power plays.`],
WIN:['Win chance',`Our estimate of each team's chance to win. It compares both Power Index scores, adds a small boost for playing at home, and lowers a team's chance if its starting goalie is a backup or key players are hurt. Even the best team rarely tops 75% in one game, because hockey has a lot of randomness.`],
LU:['Predicted lineup',`Our best guess at who plays. Goalies usually rest on the second night of back-to-back games. Injured players are replaced ("Call-up" means a minor-league player fills in). A name with * is day-to-day and expected to play. Teams confirm real lineups on game day.`],
INJ:['Injury status',`DTD (day-to-day): might play, decided close to game time. OUT: misses games for a set stretch. IR (injured reserve): out at least a week and often much longer.`]};
const info=k=>`<button class=i data-i=${k} aria-label="What does ${k} mean?">i</button>`;
const tc=c=>{const n=parseInt(c.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)>150?'#111':'#fff'};
const lg=t=>`<span class=lg style="background:${t.c};color:${tc(t.c)}">${t.a}</span>`;
const rec=a=>`${a.w}-${a.l}-${a.ol}`;
const ar=v=>v>0?`<b class=u>&#9650;${v}</b>`:v<0?`<b class=d>&#9660;${-v}</b>`:'<b class=z>&ndash;</b>';
let FAV=null,tab='home',cat='all',gday=0,injF='all';
try{const a=localStorage.getItem('nhlfav'),t=T.find(x=>x.a==a);if(t)FAV=t.i}catch(_){}
const isF=g=>FAV!=null&&(g.a==FAV||g.h==FAV);
const nextG=f=>{for(let k=0;k<10;k++){const g=sched(DI+k).find(x=>x.a==f||x.h==f);if(g)return{g,k}}};
function LU(i,d,op){const t=T[i],ij=INJL.filter(x=>x.t==i),out=n=>ij.some(x=>x.p==n&&x.s!='DTD'),dt=n=>ij.some(x=>x.p==n&&x.s=='DTD'),
b2b=d>0&&sched(d-1).some(g=>g.a==i||g.h==i),o=out(t.g[0]),bk=o||b2b,g=bk?t.g[1]:t.g[0],sw=n=>out(n)?'Call-up':dt(n)?n+'*':n,
f=t.f.map(sw),df=t.df.map(sw),lost=[...t.f,...t.df].filter(out).length,
ls=[...GM].reverse().find(x=>x.a==i||x.h==i),won=ls&&(ls.a==i?ls.ag>ls.hg:ls.hg>ls.ag),
hot=RK(0,'pp')[op]<8,off=RK(0,'off')[op]<8,ok=T[op].k;
return{g,f,df,adj:(bk?-4:0)-2.5*lost,tag:[bk?'backup goalie starting':'',lost?`${lost} key skater${lost>1?'s':''} out`:''].filter(Boolean).join(', '),
why:[bk?(o?`${t.g[0]} is injured, so ${t.g[1]} starts.`:`Second night of back-to-back games, so ${t.g[1]} starts and ${t.g[0]} rests.`):`${t.g[0]} starts: healthy and rested, with no game yesterday.`,
lost?`${lost} key skater${lost>1?'s are':' is'} out, so call-ups fill the open spots.`:ij.some(x=>x.s=='DTD')?`A * means day-to-day: expected to play unless he is a late scratch.`:`Top players are healthy, so the usual lines play.`,
ls?(won?`Coach keeps the same lines after the last win.`:`Last game was a loss. Small tweaks are possible, but the top line normally stays together.`):`No games yet, so lines follow the depth chart.`,
hot?`${ok} have a top-8 power play, so the top defence pair gets extra penalty-kill time.`:off?`${ok} have a top-8 offence, so expect the best defence pair against their top line.`:`${ok} are a lower scoring threat, so the coach can lean on offence.`]}}
function pred(g){const A=T[g.a],H=T[g.h],la=LU(g.a,g.d,g.h),lh=LU(g.h,g.d,g.a),a=M[0][g.a].pi,h=M[0][g.h].pi,p=1/(1+Math.exp(-(h-a+2.5+lh.adj-la.adj)/22));
const why=[`${(h>=a?H:A).k} rate higher: Power Index ${f1(Math.max(a,h))} vs ${f1(Math.min(a,h))}.`,`Home ice adds about 2.5 index points for ${H.k}.`];
if(la.adj)why.push(`${A.k}: ${la.tag}.`);if(lh.adj)why.push(`${H.k}: ${lh.tag}.`);
return{p,la,lh,why}}
function news(f){const t=T[f],m=M[0][f],o=[],ls=[...GM].reverse().find(g=>g.a==f||g.h==f);
if(ls){const h=ls.h==f,a=h?ls.hg:ls.ag,b=h?ls.ag:ls.hg,p=T[h?ls.a:ls.h],s=h?ls.hsf:ls.asf,q=h?ls.asf:ls.hsf,x=h?ls.hx:ls.ax,n=h?ls.ho:ls.ao;
o.push(['Result',`${t.k} ${a>b?'beat':'lose to'} ${p.k} ${a}-${b}${ls.ot?' in overtime':''}`,`${dstr(ls.d)}. Shots ${s}-${q}, power play ${x} for ${n}.`])}
else o.push(['Season','Waiting on the first game','No results yet, so rankings use preseason ratings.']);
const m2=mv(f,'all',2),r=RK(0,'all')[f]+1;
o.push(['Rankings',m2>0?`${t.k} climb ${m2} spot${m2>1?'s':''} to #${r}`:m2<0?`${t.k} slip ${-m2} spot${m2<-1?'s':''} to #${r}`:`${t.k} hold at #${r} overall`,`Power Index ${f1(m.pi)}, compared with the standings through ${dstr(DI-3)}.`]);
const ng=nextG(f);if(ng){const g=ng.g,aw=g.a==f,P=pred(g);o.push(['Preview',`Next: ${aw?'at':'vs'} ${T[aw?g.h:g.a].k} ${ng.k==0?'today':ng.k==1?'tomorrow':dstr(DI+ng.k)}`,`${Math.round((aw?1-P.p:P.p)*100)}% win chance. Projected starter in net: ${(aw?P.la:P.lh).g}.`])}
const rp=RK(0,'pp')[f]+1,rk=RK(0,'pk')[f]+1;o.push(['Special teams',rp<=rk?`Power play ranks #${rp} in the league`:`Penalty kill ranks #${rk} in the league`,rp<=rk?`Scoring on ${fp(m.pp)} of power plays.`:`Stopping ${fp(m.pk)} of opposing power plays.`]);
const ij=INJL.filter(x=>x.t==f);if(ij.length)o.push(['Injuries',ij.map(x=>x.p).join(', ')+(ij.length>1?' are':' is')+' on the injury report',ij.map(x=>`${x.p}: ${x.y}, ${x.s=='DTD'?'day-to-day':x.x.toLowerCase()}`).join('. ')+'.']);
return o}
const tiles=i=>{const m=M[0][i];return[['PTS','Points',m.pts],['REC','W-L-OT',rec(m)],['GP','Games',m.gp],['GF','Goals/game',f2(m.gf)],['GA','Against/game',f2(m.ga)],['GD','Goal diff',(m.gd>0?'+':'')+m.gd],['PP','Power play',fp(m.pp)],['PK','Penalty kill',fp(m.pk)],['SV','Save %',m.sv.toFixed(3).slice(1)],['SF','Shots/game',f1(m.sf)],['PIM','PIM/game',f1(m.pm)],['PI','Power Index',f1(m.pi)]].map(([k,l,v])=>`<div class=t><b>${v}</b><small>${l}${info(k)}</small></div>`).join('')};
const row=(i,c)=>{const t=T[i],m=M[0][i],C=CA[c];return`<details class="rw${i===FAV?' fv':''}"><summary><span class=rk>${RK(0,c)[i]+1}</span>${lg(t)}<span class=nm><b>${t.n}</b><small>${rec(m)}, ${m.pts} pts, 2-day ${ar(mv(i,c,2))}</small></span><span class=ar>${ar(mv(i,c,1))}</span><span class=v>${C.f(m[C.k])}</span></summary><div class="g3 ex">${tiles(i)}</div></details>`};
function snap(){const o=T.map(t=>t.i).sort((a,b)=>RK(0,'all')[a]-RK(0,'all')[b]).slice(0,5),d2=T.map(t=>mv(t.i,'all',2)),mx=Math.max(...d2),mn=Math.min(...d2),u=d2.indexOf(mx),dn=d2.indexOf(mn);
return`<div class=c><h2>League top 5</h2>${o.map(i=>row(i,'all')).join('')}<p class=sm style="margin-top:8px">${mx>0?`Biggest 2-day riser: ${T[u].n} ${ar(mx)}.${mn<0?` Biggest faller: ${T[dn].n} ${ar(mn)}.`:''}`:'No 2-day movement yet. Moves appear as games are played.'}</p></div><p class=sm>About this data: results, injuries and headlines in this demo are generated by a model from team ratings and the calendar. Rosters are examples and may be out of date. It is built so a real NHL feed can replace the generator.</p>`}
function home(){
if(FAV==null)return`<div class=c style="text-align:center"><div class=big>Pick your favourite team</div><p class=sm style="margin-top:6px">Your team goes front and center here with its rankings, next game, injuries and news.</p><button class=btn data-pick=1>Choose team</button></div>`+snap();
const t=T[FAV],m=M[0][FAV],r=RK(0,'all')[FAV]+1,ng=nextG(FAV);
const tl=[['off','GF'],['def','GA'],['pp','PP'],['pk','PK']].map(([c,k])=>`<div class=t><b>#${RK(0,c)[FAV]+1}</b><small>${CA[c].l}${info(k)}</small><small>${CA[c].f(m[CA[c].k])}</small></div>`).join('');
let nx='';
if(ng){const g=ng.g,aw=g.a==FAV,o=T[aw?g.h:g.a],P=pred(g),w=Math.round((aw?1-P.p:P.p)*100),l=aw?P.la:P.lh;
nx=`<div class=c><h2>Next game</h2><div class=nr>${lg(o)}<div><b>${aw?'at':'vs'} ${o.n}</b><p class=sm>${ng.k==0?'Today':ng.k==1?'Tomorrow':dstr(DI+ng.k)}, ${TM[g.tx]} PM ET. In net: ${l.g}</p></div></div><div class=pr><b>${w}%</b><div class=pb><i style="width:${w}%;background:${t.c}"></i><i style="width:${100-w}%;background:${o.c}"></i></div><b>${100-w}%</b></div><p class=sm>${t.k} win chance ${info('WIN')}</p>${ng.k<3?`<button class=btn2 data-go=${ng.k}>See predicted lineups</button>`:''}</div>`}
return`<div class="c hero" style="border-left-color:${t.c}"><div class=hh><span class=fo style="border-color:${t.c}">${lg(t)}</span><div class=hn><div class=big>${t.n}</div><p class=sm>${rec(m)}, ${m.pts} pts, ${m.gp} games</p></div><div class=rb>#${r}<small>Overall</small></div></div><p class=sm>Overall move: ${ar(mv(FAV,'all',1))} since yesterday, ${ar(mv(FAV,'all',2))} over 2 days ${info('PI')}</p><div class=g2>${tl}</div></div>`+nx+`<div class=c><h2>${t.k} news</h2>${news(FAV).map(n=>`<article class=nw><span class=tg>${n[0]}</span><b>${n[1]}</b><p>${n[2]}</p></article>`).join('')}<p class=sm style="margin:8px 0 0">Headlines are written from this tracker's data. For official news visit <a href="https://www.nhl.com/news" target=_blank rel=noopener>NHL.com</a>.</p></div>`+snap()}
function ranks(){const C=CA[cat],rk=RK(0,cat),o=T.map(t=>t.i).sort((a,b)=>rk[a]-rk[b]);
return`<div class=ch>${Object.keys(CA).map(k=>`<button class="${k==cat?'on':''}" data-cat=${k}>${CA[k].l}</button>`).join('')}</div><p class=sm>${C.x} Tap a team to see all its stats.</p><div class=c><div class=hd><span>Rank, team, change</span><span>${C.s}${info(C.i)}</span></div>${o.map(i=>row(i,cat)).join('')}</div><p class=sm>The arrow compares with yesterday. The 2-day trend under each name compares with the standings through ${dstr(DI-3)}.</p>`}
const lu=(t,l)=>`<div class=lu><div class=lh>${lg(t)}<b>${t.n}</b></div><div><span>G</span>${l.g}</div><div><span>F</span>${l.f.join(', ')}</div><div><span>D</span>${l.df.join(', ')}</div><ul class=why>${l.why.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const gc=g=>{const A=T[g.a],H=T[g.h],P=pred(g),ph=Math.round(P.p*100),pa=100-ph;
return`<div class="c gc${isF(g)?' fvc':''}"><div class=gt><span>${TM[g.tx]} PM ET</span><span>${isF(g)?'&#9733; Your team':''}</span></div><div class=gm><div class=tm>${lg(A)}<b>${A.k}</b><small>#${RK(0,'all')[A.i]+1}, ${rec(M[0][A.i])}</small></div><span class=at>at</span><div class=tm>${lg(H)}<b>${H.k}</b><small>#${RK(0,'all')[H.i]+1}, ${rec(M[0][H.i])}</small></div></div><div class=pr><b>${pa}%</b><div class=pb><i style="width:${pa}%;background:${A.c}"></i><i style="width:${ph}%;background:${H.c}"></i></div><b>${ph}%</b></div><details><summary>Why this pick, and predicted lineups</summary><ul class=why>${P.why.map(x=>`<li>${x}</li>`).join('')}</ul>${lu(A,P.la)}${lu(H,P.lh)}</details></div>`};
function games(){const d=DI+gday,L=sched(d).slice().sort((x,y)=>isF(y)-isF(x)||x.tx-y.tx);
return`<div class=ch>${[0,1,2].map(k=>`<button class="${k==gday?'on':''}" data-day=${k}>${k==0?'Today':k==1?'Tomorrow':dstr(DI+k).split(',')[0]}<small>${dstr(DI+k).split(', ')[1]}</small></button>`).join('')}</div><p class=sm>Win chance ${info('WIN')} and predicted lineups ${info('LU')} update as results and injuries change. Your team's games come first.</p>${L.map(gc).join('')}`}
function inj(){const o={IR:0,OUT:1,DTD:2},ef={G:'Backup goalie in net',F:'Forward lines reshuffled',D:'Defence pairs reshuffled'},L=INJL.filter(x=>injF=='all'||x.t==FAV).sort((a,b)=>o[a.s]-o[b.s]||T[a.t].a.localeCompare(T[b.t].a));
return`<div class=ch><button class="${injF=='all'?'on':''}" data-inj=all>All teams</button><button class="${injF=='fav'?'on':''}" data-inj=fav>My team</button></div><p class=sm>Injury status ${info('INJ')}. The lineup predictions on the Games tab already account for these.</p><div class=c>${injF=='fav'&&FAV==null?'<p>Pick a favourite team on the Home tab first.</p>':L.map(x=>`<div class=ir>${lg(T[x.t])}<div class=nm><b>${x.p}</b><small>${x.r=='G'?'Goalie':x.r=='F'?'Forward':'Defence'}, ${T[x.t].n}, ${x.y}</small><small>${x.s=='DTD'?'Game-time decision':ef[x.r]}</small></div><div class=rt><span class="st ${x.s}">${x.s}</span><small>${x.x}</small></div></div>`).join('')||'<p>No injuries to report.</p>'}</div>`}
function sheet(h,b){$('pn').innerHTML=h+(b===0?'':'<button class=btn data-x=1>Got it</button>');$('sh').hidden=false}
const close=()=>{$('sh').hidden=true};
function picker(){sheet(`<h3>Choose your favourite team</h3><div class=pk>${[...T].sort((a,b)=>a.n.localeCompare(b.n)).map(t=>`<button class="${t.i===FAV?'sel':''}" data-fav=${t.i}>${lg(t)}${t.k}</button>`).join('')}</div>`,0)}
function draw(top){$('v').innerHTML=({home,ranks,games,inj})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));$('sb').textContent=`Results through ${dstr(DI-1)}, sample data`;if(top)scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-i],[data-tab],[data-cat],[data-day],[data-pick],[data-fav],[data-x],[data-inj],[data-go]');if(!b)return;const d=b.dataset;
if(d.i){const x=IN[d.i];sheet(`<h3>${x[0]}</h3><p>${x[1]}</p>`)}
else if(d.tab){tab=d.tab;draw(1)}
else if(d.cat){cat=d.cat;draw()}
else if(d.day!=null){gday=+d.day;draw()}
else if(d.pick){picker()}
else if(d.fav!=null){FAV=+d.fav;try{localStorage.setItem('nhlfav',T[FAV].a)}catch(_){}close();tab='home';draw(1)}
else if(d.inj){injF=d.inj;draw()}
else if(d.go!=null){tab='games';gday=+d.go;draw(1)}
else if(d.x!=null)close()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close()});
draw();
</script></body></html>
