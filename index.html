<!DOCTYPE html>
<html lang="en" class="antialiased dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070F">
<title>NHL 32 Ultimate Intelligence Hub | Frost & Aurora Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    brand: {
                        iceblue: '#38BDF8',
                        deepblue: '#0B132B',
                        midnight: '#04070F',
                        frost: '#E0F2FE',
                        aurora: '#10B981',
                        glacier: '#1E293B',
                        silver: '#94A3B8',
                        purple: '#8B5CF6',
                        gold: '#F59E0B',
                        red: '#EF4444'
                    }
                },
                fontFamily: {
                    sans: ['Inter', 'system-ui', 'sans-serif'],
                    mono: ['JetBrains Mono', 'monospace']
                }
            }
        }
    }
</script>
<style>
:root {
    --bg: #04070F;
    --cd: rgba(11, 19, 43, 0.82);
    --tx: #F1F5F9;
    --mu: #94A3B8;
    --ln: rgba(56, 189, 248, 0.16);
    --ac: #38BDF8;
    --au: #10B981;
    --up: #10B981;
    --dn: #EF4444;
    --gd: #F59E0B;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
    margin: 0;
    background-color: #04070F;
    color: var(--tx);
    font: 14px/1.45 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}

/* Animated Aurora Borealis & Ice Grid Backdrop */
.aurora-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse 80% 50% at 15% 10%, rgba(56, 189, 248, 0.12), transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 20%, rgba(16, 185, 129, 0.09), transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 90%, rgba(139, 92, 246, 0.08), transparent 65%),
        radial-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 26px 26px;
    animation: auroraShift 18s ease-in-out infinite alternate;
}
@keyframes auroraShift {
    0% { filter: hue-rotate(0deg) brightness(1); }
    100% { filter: hue-rotate(14deg) brightness(1.08); }
}

button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
a { color: var(--ac); text-decoration: none; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #04070F; }
::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #38BDF8; }

/* Glassmorphism Panels */
.glass-panel {
    background: rgba(11, 19, 43, 0.78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
}

header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: rgba(4, 7, 15, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.25);
}
.hi {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
}
.brand-badge {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #38BDF8 0%, #10B981 100%);
    color: #04070F;
    font-weight: 900;
    font-size: 13px;
    display: grid;
    place-items: center;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
    letter-spacing: -0.04em;
    flex: none;
}
h1 {
    font-size: 18px;
    margin: 0;
    flex: 1;
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 900;
    color: #fff;
}
h1 small {
    display: flex;
    align-items: center;
    gap: 6px;
    font: 600 11px 'Inter', sans-serif;
    color: var(--mu);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 2px;
}
.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
    animation: pulseDot 1.8s infinite;
}
@keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
}

.ib {
    min-width: 42px;
    height: 42px;
    padding: 0 12px;
    border-radius: 99px;
    border: 1px solid rgba(56, 189, 248, 0.38);
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(16, 185, 129, 0.16));
    color: #38BDF8;
    font-size: 13px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
}
.ib:hover { transform: translateY(-1px); border-color: #38BDF8; box-shadow: 0 0 16px rgba(56, 189, 248, 0.3); }

/* Live Broadcast Ticker */
.ticker-wrap {
    background: rgba(7, 13, 30, 0.9);
    border-bottom: 1px solid rgba(56, 189, 248, 0.16);
    overflow: hidden;
    position: relative;
}
.ticker-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
}
.ticker-label {
    background: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38BDF8;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex: none;
}
.ticker-scroll {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scrollbar-width: none;
    white-space: nowrap;
    font-size: 12px;
    color: #CBD5E1;
}
.ticker-scroll::-webkit-scrollbar { display: none; }
.tick-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(56, 189, 248, 0.14);
    padding: 3px 9px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s;
}
.tick-item:hover { border-color: #38BDF8; }

#v {
    max-width: 920px;
    margin: 0 auto;
    padding: 16px 16px 112px;
    width: 100%;
}

/* Bottom Navigation */
nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    background: rgba(5, 10, 22, 0.96);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(56, 189, 248, 0.22);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.85);
}
.nav-inner {
    display: flex;
    width: 100%;
    max-width: 920px;
}
nav button {
    flex: 1;
    min-height: 62px;
    background: none;
    border: 0;
    color: var(--mu);
    font: 700 10.5px 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all 0.2s;
    position: relative;
}
nav button svg { width: 20px; height: 20px; stroke-width: 2.1; }
nav .on { color: #38BDF8; }
nav .on::after {
    content: "";
    position: absolute;
    top: 0;
    width: 28px;
    height: 3px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, #38BDF8, #10B981);
    box-shadow: 0 0 10px #38BDF8;
}

.c {
    background: rgba(11, 19, 43, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.16);
    border-radius: 20px;
    padding: 18px;
    margin: 0 0 14px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
}
.c h2 {
    font-size: 16px;
    margin: 0 0 12px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}
.sm { font-size: 12.5px; color: var(--mu); margin: 0 0 10px; }
.big { font-size: 23px; font-weight: 900; line-height: 1.15; color: #fff; letter-spacing: -0.02em; }

/* Dual-Tone Team Badges */
.lg {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 900 11px 'JetBrains Mono', monospace;
    flex: none;
    border: 2px solid rgba(255,255,255,0.28);
    box-shadow: 0 3px 12px rgba(0,0,0,0.45), inset 0 1px 1px rgba(255,255,255,0.25);
    letter-spacing: -0.03em;
    transition: transform 0.18s;
}
.team-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-align: left;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
}
.team-link:hover .lg { transform: scale(1.08); }
.team-link:hover .t-name-hover { color: #38BDF8; text-decoration: underline; text-underline-offset: 3px; }

.hero { border-left: 5px solid #38BDF8; position: relative; overflow: hidden; }
.hh { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.fo {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid;
    flex: none;
    background: rgba(4, 7, 15, 0.55);
    box-shadow: 0 0 24px rgba(0,0,0,0.55);
}
.fo .lg { width: 52px; height: 52px; font-size: 15px; }
.hn { flex: 1; min-width: 0; }
.hn .sm { margin: 3px 0 0; }

.rb {
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    color: #04070F;
    border-radius: 14px;
    padding: 8px 13px;
    font-weight: 900;
    font-size: 25px;
    line-height: 1;
    text-align: center;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35);
}
.rb small { display: block; font-size: 9.5px; font-weight: 800; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }

.g2, .g3, .g4 { display: grid; gap: 10px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media(min-width: 560px) { .g4 { grid-template-columns: repeat(4, 1fr); } }

.t {
    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(56, 189, 248, 0.14);
    border-radius: 14px;
    padding: 10px 8px;
    text-align: center;
    transition: all 0.2s;
}
.t:hover { border-color: rgba(56, 189, 248, 0.42); transform: translateY(-2px); }
.t b { display: block; font-size: 17px; color: #fff; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
.t small { display: block; font-size: 11px; color: var(--mu); margin-top: 2px; }

/* Filter Chips & Buttons */
.ch {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    scrollbar-width: none;
}
.ch::-webkit-scrollbar { display: none; }
.ch button, .chip-btn {
    flex: none;
    min-height: 40px;
    padding: 6px 15px;
    border-radius: 99px;
    border: 1px solid rgba(56, 189, 248, 0.22);
    background: rgba(11, 19, 43, 0.72);
    font-weight: 600;
    font-size: 13px;
    line-height: 1.2;
    color: var(--mu);
    transition: all 0.2s;
}
.ch button:hover, .chip-btn:hover { border-color: rgba(56, 189, 248, 0.5); color: #fff; }
.ch button small { display: block; font-size: 10px; font-weight: 500; opacity: 0.85; }
.ch .on, .chip-btn.on, .btn {
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    color: #04070F;
    border-color: #38BDF8;
    font-weight: 800;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
}
.btn, .btn2 {
    min-height: 48px;
    padding: 0 18px;
    border-radius: 14px;
    border: 0;
    font-weight: 800;
    font-size: 13.5px;
    width: 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45); }
.btn2 {
    background: rgba(56, 189, 248, 0.14);
    color: #38BDF8;
    border: 1px solid rgba(56, 189, 248, 0.32);
}
.btn2:hover { background: rgba(56, 189, 248, 0.24); border-color: #38BDF8; }

.hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--mu);
    padding-bottom: 8px;
    border-bottom: 2px solid rgba(56, 189, 248, 0.28);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
}
.rw { border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.rw.fv {
    background: rgba(56, 189, 248, 0.09);
    border-radius: 14px;
    margin: 4px 0;
    border: 1px solid rgba(56, 189, 248, 0.35);
}
.rw summary {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 60px;
    padding: 6px 6px;
    list-style: none;
    cursor: pointer;
    color: var(--tx);
    font-weight: 500;
}
.rw summary::-webkit-details-marker { display: none; }
.ex { padding: 8px 6px 14px; }
.rk { width: 28px; text-align: center; font-weight: 900; font-size: 16px; color: #fff; font-family: 'JetBrains Mono', monospace; }
.nm { flex: 1; min-width: 0; }
.nm > b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 700; }
.nm small { display: block; color: var(--mu); font-size: 11px; }
.v { min-width: 62px; text-align: right; font-weight: 900; font-size: 15.5px; color: #fff; font-family: 'JetBrains Mono', monospace; }
.ar { min-width: 36px; text-align: center; }
.u { color: var(--up); } .d { color: var(--dn); } .z { color: var(--mu); }
.u, .d, .z { font-size: 11.5px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }

/* Percentile Sparkbar */
.pct-bar-wrap { margin-top: 10px; background: rgba(15, 23, 42, 0.7); padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.14); }
.pct-track { height: 7px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.pct-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #38BDF8, #10B981); }

.i {
    position: relative;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1.5px solid #38BDF8;
    background: none;
    color: #38BDF8;
    font: italic 700 10.5px/1 Georgia, serif;
    padding: 0;
    display: inline-grid;
    place-items: center;
    vertical-align: middle;
    margin-left: 5px;
    cursor: pointer;
    transition: all 0.2s;
}
.i:hover { background: #38BDF8; color: #04070F; }
.i::before { content: ""; position: absolute; inset: -10px; }

.nw { padding: 12px 0; border-top: 1px solid rgba(56, 189, 248, 0.1); }
.nw:first-of-type { border-top: 0; padding-top: 0; }
.nw b { display: block; font-size: 14.5px; margin: 2px 0 4px; color: #fff; }
.nw p { margin: 0; font-size: 12.5px; color: var(--mu); }
.tg { font: 800 10.5px 'Inter', sans-serif; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.06em; }

.nr { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.nr p { margin: 0; }
.gt { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--mu); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
.gm { display: flex; align-items: center; justify-content: space-around; margin: 6px 0 12px; }
.tm { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 105px; text-align: center; }
.tm .lg { width: 48px; height: 48px; font-size: 13px; }
.tm b { color: #fff; font-size: 15px; }
.tm small { font-size: 11px; color: var(--mu); }
.at { color: var(--mu); font-weight: 800; font-style: italic; font-size: 13px; }

.score-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 6px 14px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.win-score { color: #10B981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.45); }

.pr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pr > b { width: 46px; text-align: center; font-weight: 900; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.pb { flex: 1; height: 11px; display: flex; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,0.06); border: 1px solid rgba(56, 189, 248, 0.2); }
.pb i { display: block; height: 100%; transition: width 0.5s ease; }
.pb i + i { border-left: 2px solid #04070F; }

.fvc { border-color: #38BDF8 !important; border-width: 2px; box-shadow: 0 0 22px rgba(56, 189, 248, 0.22); }
details > summary { cursor: pointer; }
.gc > details > summary { min-height: 40px; display: flex; align-items: center; font-weight: 700; color: #38BDF8; font-size: 12.5px; }
.why { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--mu); }
.why li { margin-bottom: 4px; }
.lu { border-top: 1px solid rgba(56, 189, 248, 0.12); padding: 10px 0; font-size: 12.5px; }
.lu > div > span { display: inline-block; width: 22px; font-weight: 900; color: #38BDF8; font-family: 'JetBrains Mono', monospace; }
.lh { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; color: #fff; }

.ir { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.ir:last-child { border-bottom: 0; }
.rt { text-align: right; }
.rt small { display: block; font-size: 11px; color: var(--mu); margin-top: 3px; }
.st { display: inline-block; padding: 3px 9px; border-radius: 99px; font: 800 10.5px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.04em; }
.st.DTD { background: rgba(245, 158, 11, 0.18); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
.st.OUT { background: rgba(239, 68, 68, 0.18); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
.st.IR { background: rgba(153, 27, 27, 0.38); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.55); }

/* Playoff Status Badges */
.po-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 6px;
    margin-left: 6px;
}
.po-x { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.45); }
.po-wc { background: rgba(56, 189, 248, 0.2); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.45); }
.cutline-row td { border-bottom: 2px dashed rgba(16, 185, 129, 0.55) !important; }

/* Controls UI */
.ctrl-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
}
.search-inp {
    flex: 1;
    min-width: 180px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 12px;
    padding: 9px 13px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: all 0.2s;
}
.search-inp:focus { border-color: #38BDF8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.28); }
.sel-box {
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(56, 189, 248, 0.32);
    border-radius: 12px;
    padding: 9px 12px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    outline: none;
    width: 100%;
}
.sel-box:focus { border-color: #38BDF8; }

/* Standings Table View */
.tbl-wrap { overflow-x: auto; margin-top: 8px; border-radius: 14px; border: 1px solid rgba(56, 189, 248, 0.16); }
.st-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: center; }
.st-tbl th {
    background: rgba(7, 13, 30, 0.95);
    color: var(--mu);
    font-weight: 800;

<script>
const $ = id => document.getElementById(id);

const RAW = `ANA|Anaheim:Ducks|#F47A38|2.8|3.2|20|77|Dostal,Husso|Terry,Carlsson,Zegras|LaCombe,Gudas|Pacific|Western

EDM|Edmonton:Oilers|#FF4C00|3.2|2.9|26|80|Skinner,Pickard|McDavid,Draisaitl,Hyman|Bouchard,Ekholm|Pacific|Western
FLA|Florida:Panthers|#C8102E|3.1|2.7|22|80|Bobrovsky,Tarasov|Barkov,Reinhart,Tkachuk|Ekblad,Forsling|Atlantic|Eastern

MTL|Montreal:Canadiens|#AF1E2D|3.0|3.1|20|79|Montembeault,Dobes|Suzuki,Caufield,Demidov|Hutson,Guhle|Atlantic|Eastern
NSH|Nashville:Predators|#FFB81C|2.9|3.1|20|79|Saros,Annunen|Stamkos,O'Reilly,Marchessault|Josi,Carrier|Central|Western
NJD|New Jersey:Devils|#CE1126|3.0|3.0|21|80|Markstrom,Jacobs|Hughes,Hischier,Meier|Hamilton,Siegenthaler|Metropolitan|Eastern
NYI|New York:Islanders|#2F7FD0|2.7|3.0|18|80|Sorokin,Rittich|Barzal,Horvat,Lee|Pulock,Romanov|Metropolitan|Eastern
NYR|New York:Rangers|#1F56C4|3.0|3.0|21|80|Shesterkin,Quick|Panarin,Zibanejad,Lafreniere|Fox,Miller|Metropolitan|Eastern
OTT|Ottawa:Senators|#C52032|3.1|3.0|23|79|Ullmark,Forsberg|Tkachuk,Stutzle,Batherson|Chabot,Sanderson|Atlantic|Eastern
PHI|Philadelphia:Flyers|#F74902|2.8|3.2|19|79|Fedotov,Ersson|Michkov,Konecny,Tippett|Sanheim,Seeler|Metropolitan|Eastern
PIT|Pittsburgh:Penguins|#FCB514|2.8|3.3|20|77|Silovs,Blomqvist|Crosby,Malkin,Rakell|Karlsson,Letang|Metropolitan|Eastern
SJS|San Jose:Sharks|#006D75|2.5|3.5|18|77|Askarov,Nedeljkovic|Celebrini,Smith,Eklund|Ferraro,Thrun|Pacific|Western
SEA|Seattle:Kraken|#68A2B9|2.8|3.2|19|78|Grubauer,Daccord|Schwartz,Wright,Beniers|Larsson,Dunn|Pacific|Western
STL|St. Louis:Blues|#2F5FC0|2.9|3.0|19|80|Binnington,Hofer|Thomas,Kyrou,Schenn|Parayko,Faulk|Central|Western
TBL|Tampa Bay:Lightning|#1E4FB0|3.3|2.8|24|80|Vasilevskiy,Johansson|Kucherov,Point,Guentzel|Hedman,McDonagh|Atlantic|Eastern
TOR|Toronto:Maple Leafs|#1F4DAA|3.2|2.9|23|80|Stolarz,Woll|Matthews,Nylander,Tavares|Rielly,McCabe|Atlantic|Eastern
UTA|Utah:Mammoth|#6CACE4|3.0|3.0|21|80|Vejmelka,Ingram|Keller,Cooley,Guenther|Sergachev,Durzi|Central|Western
VAN|Vancouver:Canadiens|#00843D|2.9|3.0|21|80|Demko,Lankinen|Pettersson,Miller,Boeser|Hughes,Hronek|Pacific|Western
VGK|Vegas:Golden Knights|#B4975A|3.3|2.8|22|82|Hill,Schmid|Eichel,Marner,Stone|Pietrangelo,Theodore|Pacific|Western
WSH|Washington:Capitals|#C8102E|3.3|2.8|22|80|Thompson,Lindgren|Ovechkin,Strome,Wilson|Carlson,Fehervary|Metropolitan|Eastern
WPG|Winnipeg:Jets|#3A5F9E|3.3|2.4|24|82|Hellebuyck,Comrie|Scheifele,Connor,Ehlers|Morrissey,Pionk|Central|Western`.replace('Vancouver:Canadiens', 'Vancouver:Canucks');

const T = RAW.split('\n').map((l, i) => {
    const p = l.split('|'), [c, k] = p[1].split(':');
    return { i, a: p[0], k, n: c + ' ' + k, c: p[2], o: +p[3], d: +p[4], pp: +p[5], pk: +p[6], g: p[7].split(','), f: p[8].split(','), df: p[9].split(','), div: p[10], conf: p[11], tr: .8 + (i * 7 % 9) / 20 };
});

// Deterministic PRNG & Poisson Generator
const R = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
const po = (l, r) => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= r() } while (p > L); return k - 1 };

const D0 = Date.UTC(2026, 9, 7), now = new Date(), DI = Math.max(1, Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - D0) / 864e5));
const dstr = d => new Date(D0 + d * 864e5).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const TM = ['7:00', '7:30', '8:00', '10:00'], SC = {};

const sched = d => SC[d] || (SC[d] = (() => {
    const r = R(d * 7919 + 13), a = [...Array(32).keys()];
    for (let i = 31; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    const n = 4 + Math.floor(r() * 7), g = [];
    for (let i = 0; i < n; i++) g.push({ d, a: a[2 * i], h: a[2 * i + 1], tx: Math.floor(r() * 4), id: `${d}-${i}` });
    return g;
})());

const sim = (g, j, seedOffset = 0) => {
    const r = R(g.d * 104729 + j * 31 + 5 + seedOffset), A = T[g.a], H = T[g.h];
    let ag = po(A.o * H.d / 3 * .98, r), hg = po(H.o * A.d / 3 * 1.03, r), ot = 0;
    if (ag == hg) { ot = 1; r() < .5 + (A.o - A.d - H.o + H.d) * .08 ? ag++ : hg++; }
    const pp = (x, y) => { const o = po(2.3 * y.tr, r); let s = 0; for (let i = 0; i < o; i++) if (r() < x.pp / 100 * (100 - y.pk) / 21) s++; return [o, s] };
    const [ao, ax] = pp(A, H), [ho, hx] = pp(H, A);
    return {
        d: g.d, a: g.a, h: g.h, ag, hg, ot, ao, ax: Math.min(ax, ag), ho, hx: Math.min(hx, hg),
        ap: 2 * ho + (r() < .4 ? 5 : 0), hp: 2 * ao + (r() < .4 ? 5 : 0),
        asf: Math.round(29 + (A.o - 3) * 6 + r() * 8 - 4), hsf: Math.round(30 + (H.o - 3) * 6 + r() * 8 - 4)
    };
};

const GM = [];
for (let d = 0; d < DI; d++) sched(d).forEach((g, j) => GM.push(sim(g, j)));

const ST = n => {
    const s = T.map(() => ({ gp: 0, w: 0, l: 0, ol: 0, gf: 0, ga: 0, ppg: 0, ppo: 0, pkg: 0, pko: 0, sf: 0, sa: 0, pim: 0 }));
    for (const g of GM) {
        if (g.d > n) break;
        const u = (i, gf, ga, po_, pg, ko, kg, sf, sa, pim) => {
            const x = s[i]; x.gp++; x.gf += gf; x.ga += ga; x.ppo += po_; x.ppg += pg; x.pko += ko; x.pkg += kg; x.sf += sf; x.sa += sa; x.pim += pim;
            gf > ga ? x.w++ : g.ot ? x.ol++ : x.l++;
        };
        u(g.a, g.ag, g.hg, g.ao, g.ax, g.ho, g.hx, g.asf, g.hsf, g.ap);
        u(g.h, g.hg, g.ag, g.ho, g.hx, g.ao, g.ax, g.hsf, g.asf, g.hp);
    }
    return s;
};

const K = 8, MT = s => T.map((t, i) => {
    const a = s[i], g = a.gp, pts = 2 * a.w + a.ol,
        gf = (t.o * K + a.gf) / (K + g), ga = (t.d * K + a.ga) / (K + g),
        pp = (t.pp * 3 * K + 100 * a.ppg) / (3 * K + a.ppo),
        pk = (t.pk * 3 * K + 100 * (a.pko - a.pkg)) / (3 * K + a.pko),
        sv = 1 - (t.d * K + a.ga) / (29 * K + a.sa),
        sf = ((29.5 + (t.o - 3) * 6) * K + a.sf) / (K + g),
        pm = (6.6 * t.tr * K + a.pim) / (K + g),
        pq = (.5 + .17 * (t.o - t.d)),
        pw = (pq * K + pts / 2) / (K + g);
    return {
        ...a, pts, gf, ga, pp, pk, sv, sf, pm,
        totGf: a.gf, totGa: a.ga,
        gd: a.gf - a.ga,
        pi: 50 + 40 * (pw - .5) + 10 * (gf - ga) + .3 * ((pp - 21) + (pk - 80))
    };
});

const M = [MT(ST(DI - 1)), MT(ST(DI - 2)), MT(ST(DI - 3))];
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2), fp = v => v.toFixed(1) + '%';
const CA = {
    all: { l: 'Overall', k: 'pi', up: 1, f: f1, s: 'Power Index', i: 'PI', x: 'Comprehensive 0-100 strength rating blending points rate, goal diff, and special teams.' },
    off: { l: 'Offence', k: 'gf', up: 1, f: f2, s: 'Goals/Game', i: 'GF', x: 'Bayesian-adjusted average goals scored per game.' },
    def: { l: 'Defence', k: 'ga', up: 0, f: f2, s: 'Against/Game', i: 'GA', x: 'Bayesian-adjusted average goals allowed per game.' },
    pp: { l: 'Power Play', k: 'pp', up: 1, f: fp, s: 'Power Play %', i: 'PP', x: 'Man-advantage scoring conversion efficiency.' },
    pk: { l: 'Penalty Kill', k: 'pk', up: 1, f: fp, s: 'Penalty Kill %', i: 'PK', x: 'Short-handed defensive kill success rate.' },
    gk: { l: 'Goalies', k: 'sv', up: 1, f: v => v.toFixed(3).slice(1), s: 'Save %', i: 'SV', x: 'Team goaltending save percentage.' },
    dis: { l: 'Discipline', k: 'pm', up: 0, f: f1, s: 'PIM/Game', i: 'PIM', x: 'Fewest penalty minutes assessed per game.' }
};

const RKc = {}, RK = (m, c) => RKc[m + c] || (RKc[m + c] = (() => {
    const { k, up } = CA[c], X = M[m], o = T.map(t => t.i).sort((x, y) => (up ? X[y][k] - X[x][k] : X[x][k] - X[y][k]) || X[y].pi - X[x].pi), r = [];
    o.forEach((t, p) => r[t] = p);
    return r;
})());

const mv = (i, c, l) => RK(l, c)[i] - RK(0, c)[i];

// Injury Simulation
const IT = ['Upper body', 'Lower body', 'Illness', 'Knee', 'Shoulder', 'Concussion', 'Hand', 'Ankle'];
const INJL = (() => {
    const w = Math.floor(DI / 5), L = [];
    T.forEach(t => [t.g[0], ...t.f, ...t.df].forEach((p, j) => {
        const r = R(w * 911 + t.i * 53 + j * 7 + 3);
        if (r() < .095) {
            const s = r(), y = IT[Math.floor(r() * IT.length)], k = s < .5 ? 'DTD' : s < .85 ? 'OUT' : 'IR';
            L.push({ t: t.i, p, r: j ? j < 4 ? 'F' : 'D' : 'G', y, s: k, x: k == 'DTD' ? 'Day-to-day' : k == 'OUT' ? `About ${1 + Math.floor(r() * 3)} weeks` : `${4 + Math.floor(r() * 5)}+ weeks` });
        }
    }));
    return L;
})();

// Deterministic Player Season Stats Derived from Team Simulated Games
function playerStats(teamIdx, name, role, slotIdx) {
    const m = M[0][teamIdx];
    const gp = Math.max(1, m.gp - (INJL.some(x => x.t === teamIdx && x.p === name && x.s !== 'DTD') ? Math.min(m.gp - 1, 4) : 0));
    const r = R(teamIdx * 313 + slotIdx * 97 + 19);
    if (role === 'G') {
        const share = slotIdx === 0 ? 0.68 : 0.32;
        const gGp = Math.max(1, Math.round(gp * share));
        const gW = Math.min(gGp, Math.round(m.w * share + (r() - 0.4)));
        const gaa = Math.max(1.85, m.ga + (slotIdx === 0 ? -0.14 : 0.22) + (r() - 0.5) * 0.25);
        const svp = Math.min(.938, Math.max(.882, m.sv + (slotIdx === 0 ? 0.005 : -0.007) + (r() - 0.5) * 0.008));
        return { gp: gGp, w: Math.max(0, gW), gaa: gaa.toFixed(2), svp: svp.toFixed(3).slice(1) };
    }
    const mult = role === 'F' ? [1.28, 1.08, 0.94][slotIdx] || 0.9 : [0.85, 0.62][slotIdx] || 0.6;
    const basePtsRate = (m.gf / 3.0) * mult * (0.9 + r() * 0.25);
    const pts = Math.max(1, Math.round(gp * basePtsRate));
    const gRatio = role === 'F' ? (0.38 + r() * 0.14) : (0.20 + r() * 0.10);
    const goals = Math.min(pts, Math.round(pts * gRatio));
    const assists = pts - goals;
    return { gp, g: goals, a: assists, pts };
}

function LU(i, d, op, ignoreInj = false) {
    const t = T[i], ij = ignoreInj ? [] : INJL.filter(x => x.t == i),
        out = n => ij.some(x => x.p == n && x.s != 'DTD'),
        dt = n => ij.some(x => x.p == n && x.s == 'DTD'),
        b2b = d > 0 && sched(d - 1).some(g => g.a == i || g.h == i),
        o = out(t.g[0]), bk = o || b2b, g = bk ? t.g[1] : t.g[0],
        sw = n => out(n) ? 'Call-up' : dt(n) ? n + '*' : n,
        f = t.f.map(sw), df = t.df.map(sw),
        lost = [...t.f, ...t.df].filter(out).length,
        ls = [...GM].reverse().find(x => x.a == i || x.h == i),
        won = ls && (ls.a == i ? ls.ag > ls.hg : ls.hg > ls.ag),
        hot = RK(0, 'pp')[op] < 8, off = RK(0, 'off')[op] < 8, ok = T[op].k;
    return {
        g, f, df, adj: (bk ? -4 : 0) - 2.5 * lost,
        tag: [bk ? 'backup goalie starting' : '', lost ? `${lost} key skater${lost > 1 ? 's' : ''} out` : ''].filter(Boolean).join(', '),
        why: [
            bk ? (o ? `${t.g[0]} is sidelined, so ${t.g[1]} gets the crease.` : `Second night of a back-to-back; ${t.g[1]} starts while ${t.g[0]} rests.`) : `${t.g[0]} starts in net: rested and confirmed.`,
            lost ? `${lost} key skater${lost > 1 ? 's are' : ' is'} out of the lineup.` : ij.some(x => x.s == 'DTD') ? `Day-to-day game-time decisions expected to dress.` : `Full lineup health maintained.`,
            ls ? (won ? `Carrying momentum following previous victory.` : `Adjusting line combinations after last defeat.`) : `Opening depth charts active.`,
            hot ? `${ok} boast a top-8 power play; disciplined penalty kill deployment is critical.` : off ? `${ok} feature a top-8 offence; top shutdown pair will match up.` : `Balanced four-line tactical deployment expected.`
        ]
    };
}

function pred(g, ignoreInj = false) {
    const A = T[g.a], H = T[g.h], la = LU(g.a, g.d, g.h, ignoreInj), lh = LU(g.h, g.d, g.a, ignoreInj),
        a = M[0][g.a].pi, h = M[0][g.h].pi,
        p = 1 / (1 + Math.exp(-(h - a + 2.5 + lh.adj - la.adj) / 22));
    const why = [`${(h >= a ? H : A).k} hold the Power Index edge (${f1(Math.max(a, h))} vs ${f1(Math.min(a, h))}).`, `Home-ice advantage (+2.5 PI) factored for ${H.k}.`];
    if (la.adj) why.push(`${A.k}: ${la.tag}.`);
    if (lh.adj) why.push(`${H.k}: ${lh.tag}.`);
    return { p, la, lh, why };
}

function getPlayoffBadges() {
    const badges = {};
    ['Eastern', 'Western'].forEach(conf => {
        const confTeams = T.filter(t => t.conf === conf).map(t => t.i);
        const divs = conf === 'Eastern' ? ['Atlantic', 'Metropolitan'] : ['Central', 'Pacific'];
        const divTop3 = new Set();
        divs.forEach(d => {
            const dTeams = confTeams.filter(i => T[i].div === d).sort((a, b) => M[0][b].pts - M[0][a].pts || M[0][b].w - M[0][a].w || M[0][b].gd - M[0][a].gd);
            dTeams.slice(0, 3).forEach((id, idx) => { divTop3.add(id); badges[id] = `D${idx + 1}`; });
        });
        const wcPool = confTeams.filter(i => !divTop3.has(i)).sort((a, b) => M[0][b].pts - M[0][a].pts || M[0][b].w - M[0][a].w || M[0][b].gd - M[0][a].gd);
        if (wcPool[0] != null) badges[wcPool[0]] = 'WC1';

    });
    return badges;
}

// Interactive H2H Matchup Comparator & Simulator
function runH2HSim(aIdx, bIdx, homeB, useInj) {
    const A = T[aIdx], B = T[bIdx];
    const gObj = { d: DI, a: homeB ? aIdx : bIdx, h: homeB ? bIdx : aIdx };
    const P = pred(gObj, !useInj);
    const seed = Math.floor(Math.random() * 100000);
    const r = R(seed);

    // Period by period scoring
    const pA = [0, 0, 0], pB = [0, 0, 0];
    const pHome = P.p;
    const winProbA = homeB ? (1 - pHome) : pHome;
    const expA = (A.o * B.d / 3) * (homeB ? 0.98 : 1.03) * (winProbA / 0.5) ** 0.25;
    const expB = (B.o * A.d / 3) * (homeB ? 1.03 : 0.98) * ((1 - winProbA) / 0.5) ** 0.25;

    for (let per = 0; per < 3; per++) {
        pA[per] = po(expA / 3, r);
        pB[per] = po(expB / 3, r);
    }
    let totA = pA[0] + pA[1] + pA[2], totB = pB[0] + pB[1] + pB[2], otLabel = '';
    if (totA === totB) {
        otLabel = r() < 0.65 ? 'OT' : 'SO';
        if (r() < winProbA) { totA++; pA.push(1); pB.push(0); }
        else { totB++; pA.push(0); pB.push(1); }
    }
    const shotsA = Math.max(totA + 14, Math.round(28 + (A.o - 3) * 6 + r() * 10 - 5));
    const shotsB = Math.max(totB + 14, Math.round(29 + (B.o - 3) * 6 + r() * 10 - 5));
    const ppA = `${Math.min(totA, po(0.65, r))}/${po(2.6, r) + 1}`;
    const ppB = `${Math.min(totB, po(0.65, r))}/${po(2.6, r) + 1}`;

    // 3 Stars of the Game
    const winT = totA > totB ? A : B, loseT = totA > totB ? B : A;
    const winGoals = Math.max(totA, totB);
    const stars = [
        { rank: '1st Star', name: winT.f[0], team: winT.a, stat: `${Math.min(3, Math.max(1, Math.ceil(winGoals / 2)))}G, ${Math.floor(r() * 2) + 1}A` },
        { rank: '2nd Star', name: winT.g[0], team: winT.a, stat: `${(totA > totB ? shotsB - totB : shotsA - totA)} Saves (${((1 - Math.min(totA, totB) / Math.max(20, (totA > totB ? shotsB : shotsA))) * 100).toFixed(1)}%)` },
        { rank: '3rd Star', name: loseT.f[0], team: loseT.a, stat: `${Math.min(2, Math.min(totA, totB))}G, ${Math.floor(r() * 5) + 3} SOG` }
    ];

    return { aIdx, bIdx, homeB, pA, pB, totA, totB, otLabel, shotsA, shotsB, ppA, ppB, stars };
}

function sim() {
    if (simA === simB) simB = (simA + 1) % 32;
    const A = T[simA], B = T[simB], mA = M[0][simA], mB = M[0][simB];
    const gObj = { d: DI, a: simHomeB ? simA : simB, h: simHomeB ? simB : simA };
    const P = pred(gObj, !simInjActive);
    const probA = Math.round((simHomeB ? (1 - P.p) : P.p) * 100);
    const probB = 100 - probA;

    const metrics = [
        ['Power Index', mA.pi, mB.pi, f1(mA.pi), f1(mB.pi), 100],
        ['Offence (GF/G)', mA.gf, mB.gf, f2(mA.gf), f2(mB.gf), 4.2],
        ['Defence (GA/G)', 5 - mA.ga, 5 - mB.ga, f2(mA.ga), f2(mB.ga), 3.0],
        ['Power Play %', mA.pp, mB.pp, fp(mA.pp), fp(mB.pp), 32],
        ['Penalty Kill %', mA.pk, mB.pk, fp(mA.pk), fp(mB.pk), 92],
        ['Goalie Save %', (mA.sv - 0.87) * 100, (mB.sv - 0.87) * 100, mA.sv.toFixed(3).slice(1), mB.sv.toFixed(3).slice(1), 7.5]
    ];

    let boxHtml = '';
    if (simResult && simResult.aIdx === simA && simResult.bIdx === simB) {
        const s = simResult;
        const hasOT = s.pA.length > 3;
        boxHtml = `<div class="c" style="border:1.5px solid #10B981;background:rgba(16,185,129,0.06)">
            <h2><span>Simulated Box Score</span><span class="po-badge po-x">FINAL${s.otLabel ? ' (' + s.otLabel + ')' : ''}</span></h2>
            <div class="gm">
                <div class="tm">${lg(A)}<b>${A.k}</b><small>${simHomeB ? 'AWAY' : 'HOME'}</small></div>

                    <span class="${s.totB > s.totA ? 'win-score' : ''}">${s.totB}</span>
                </div>
                <div class="tm">${lg(B)}<b>${B.k}</b><small>${simHomeB ? 'HOME' : 'AWAY'}</small></div>
            </div>
            <div class="tbl-wrap" style="margin-bottom:12px">
                <table class="st-tbl">
                    <thead><tr><th style="text-align:left">Team</th><th>1st</th><th>2nd</th><th>3rd</th>${hasOT ? `<th>${s.otLabel}</th>` : ''}<th>TOT</th><th>SOG</th><th>PP</th></tr></thead>
                    <tbody>
                        <tr><td style="text-align:left;font-weight:800;color:#fff">${A.a}</td><td>${s.pA[0]}</td><td>${s.pA[1]}</td><td>${s.pA[2]}</td>${hasOT ? `<td>${s.pA[3]}</td>` : ''}<td><b style="color:#38BDF8">${s.totA}</b></td><td>${s.shotsA}</td><td>${s.ppA}</td></tr>
                        <tr><td style="text-align:left;font-weight:800;color:#fff">${B.a}</td><td>${s.pB[0]}</td><td>${s.pB[1]}</td><td>${s.pB[2]}</td>${hasOT ? `<td>${s.pB[3]}</td>` : ''}<td><b style="color:#38BDF8">${s.totB}</b></td><td>${s.shotsB}</td><td>${s.ppB}</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="font-size:11.5px;font-weight:800;color:#38BDF8;text-transform:uppercase;margin-bottom:6px">Three Stars of the Game</div>
            <div class="g3">

        </div>`;
    }

    return `<div class="c">
        <h2><span>Head-to-Head Matchup Lab & Simulator</span><span class="tg">Interactive Engine</span></h2>
        <p class="sm">Select any two franchises to compare underlying metrics, toggle venue & injury models, and simulate a full period-by-period game.</p>
        <div class="g2" style="margin-bottom:10px">
            <div>
                <label style="font-size:11px;font-weight:700;color:var(--mu);display:block;margin-bottom:4px">FRANCHISE A (${simHomeB ? 'AWAY' : 'HOME'})</label>
                <select id="sel-sim-a" class="sel-box">${[...T].sort((x, y) => x.n.localeCompare(y.n)).map(t => `<option value="${t.i}" ${t.i === simA ? 'selected' : ''}>${t.n}</option>`).join('')}</select>
            </div>

                <label style="font-size:11px;font-weight:700;color:var(--mu);display:block;margin-bottom:4px">FRANCHISE B (${simHomeB ? 'HOME' : 'AWAY'})</label>

            </div>
        </div>
        <div class="ch" style="padding-bottom:4px">
            <button class="${simHomeB ? 'on' : ''}" data-simopt="home">Home Ice: ${B.k}</button>
            <button class="${!simHomeB ? 'on' : ''}" data-simopt="away">Home Ice: ${A.k}</button>
            <button class="${simInjActive ? 'on' : ''}" data-simopt="inj">Injuries: ${simInjActive ? 'Active' : 'Healthy'}</button>

            </div>

        </div>
        <div class="pr"><b>${probA}%</b><div class="pb"><i style="width:${probA}%;background:${A.c}"></i><i style="width:${probB}%;background:${B.c}"></i></div><b>${probB}%</b></div>
        <button class="btn" data-runsim="1">&#9889; Simulate Full Game (60 Min + OT/SO)</button>
    </div>` + boxHtml + `<div class="c">
        <h2>Tale of the Tape — Multi-Axis Comparison</h2>
        ${metrics.map(([lbl, vA, vB, dispA, dispB, maxV]) => {
            const wA = Math.min(100, Math.max(8, Math.round((vA / maxV) * 100)));
            const wB = Math.min(100, Math.max(8, Math.round((vB / maxV) * 100)));
            return `<div class="cmp-row">
                <div class="cmp-head"><span style="font-family:'JetBrains Mono',monospace;color:${vA >= vB ? '#10B981' : '#fff'}">${dispA}</span><span style="color:var(--mu);font-size:11.5px">${lbl}</span><span style="font-family:'JetBrains Mono',monospace;color:${vB >= vA ? '#10B981' : '#fff'}">${dispB}</span></div>
                <div class="cmp-bars">
                    <div class="cmp-track-l"><div class="cmp-fill" style="width:${wA}%;background:${A.c}"></div></div>
                    <div class="cmp-track-r"><div class="cmp-fill" style="width:${wB}%;background:${B.c}"></div></div>
                </div>
            </div>`;
        }).join('')}
    </div>`;
}

function rosters() {

        return teamMatch || playerMatch;
    });

    return `<div class="ctrl-bar">
        <input type="text" id="srch" placeholder="Search player (e.g. McDavid, Bedard) or team..." class="search-inp" value="${searchQuery}">

}

const lu = (t, l) => `<div class="lu"><div class="lh">${lg(t)}<b>${t.n}</b></div><div><span>G</span>${l.g}</div><div><span>F</span>${l.f.join(', ')}</div><div><span>D</span>${l.df.join(', ')}</div><ul class="why">${l.why.map(x => `<li>${x}</li>`).join('')}</ul></div>`;

const gc = (g, idx) => {
    const A = T[g.a], H = T[g.h];
    // Yesterday's Final Results (-1)
    if (gday === -1) {
        const res = GM.find(x => x.d === g.d && x.a === g.a && x.h === g.h) || sim(g, idx);
        return `<div class="c gc${isF(g) ? ' fvc' : ''}">
            <div class="gt"><span>FINAL${res.ot ? ' (OT)' : ''} &bull; ${dstr(g.d)}</span><span>${isF(g) ? '&#9733; Priority Watch' : ''}</span></div>
            <div class="gm">
                <div class="tm">${lg(A)}<b>${A.k}</b><small>SOG: ${res.asf} &bull; PP: ${res.ax}/${res.ao}</small></div>
                <div class="score-pill">
                    <span class="${res.ag > res.hg ? 'win-score' : ''}">${res.ag}</span>
                    <span style="font-size:13px;color:var(--mu)">-</span>
                    <span class="${res.hg > res.ag ? 'win-score' : ''}">${res.hg}</span>
                </div>
                <div class="tm">${lg(H)}<b>${H.k}</b><small>SOG: ${res.hsf} &bull; PP: ${res.hx}/${res.ho}</small></div>
            </div>
        </div>`;
    }

    const P = pred(g), ph = Math.round(P.p * 100), pa = 100 - ph;
    const mockRes = slateSims[g.id];
    return `<div class="c gc${isF(g) ? ' fvc' : ''}">
        <div class="gt"><span>${TM[g.tx]} PM ET</span><span>${isF(g) ? '&#9733; Priority Watch' : ''}</span></div>
        <div class="gm">
            <div class="tm">${lg(A)}<b>${A.k}</b><small>#${RK(0, 'all')[A.i] + 1} (${rec(M[0][A.i])})</small></div>

        </div>

            <button class="chip-btn" data-simslate="${g.id}" style="flex:1;min-height:36px;font-size:12px">&#9889; ${mockRes ? 'Re-Sim Game' : 'Quick Sim'}</button>

        </div>

    </div>`;
};

function games() {
    const d = DI + gday;

// Team Deep-Dive Modal Profile
function openTeamModal(teamIdx) {
    const t = T[teamIdx], m = M[0][teamIdx], rkAll = RK(0, 'all')[teamIdx] + 1;
    const recent = GM.filter(g => g.a === teamIdx || g.h === teamIdx).slice(-5).reverse();
    const upcoming = [];
    for (let k = 0; k < 10 && upcoming.length < 3; k++) {
        const g = sched(DI + k).find(x => x.a === teamIdx || x.h === teamIdx);
        if (g) upcoming.push({ g, k });
    }
    const ij = INJL.filter(x => x.t === teamIdx);

    const formHtml = recent.map(g => {
        const isH = g.h === teamIdx, gf = isH ? g.hg : g.ag, ga = isH ? g.ag : g.hg;
        const res = gf > ga ? 'W' : g.ot ? 'OTL' : 'L';
        const opp = T[isH ? g.a : g.h];
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:rgba(15,23,42,0.7);border-radius:10px;margin-bottom:5px;font-size:12px">
            <span style="display:flex;align-items:center;gap:8px"><span class="fpill ${res}">${res}</span><b>${isH ? 'vs' : '@'} ${opp.k}</b></span>
            <span style="font-family:'JetBrains Mono',monospace;font-weight:800;color:#fff">${gf}-${ga}${g.ot ? ' (OT)' : ''} <small style="color:var(--mu);font-weight:500">${dstr(g.d)}</small></span>

    }).join('');

    const upHtml = upcoming.map(({ g, k }) => {

                ${formHtml || '<p class="sm">No games logged yet.</p>'}
            </div>
            <div>
                <div style="font-size:11px;font-weight:800;color:#38BDF8;text-transform:uppercase;margin-bottom:6px">Upcoming 3 Fixtures</div>
                ${upHtml}
            </div>
        </div>
        <div style="background:rgba(15,23,42,0.65);border:1px solid rgba(56,189,248,0.16);border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:12px">

            <div><b style="color:#38BDF8">Goalies:</b> ${t.g.join(', ')}</div>
            <div><b style="color:#38BDF8">Forwards:</b> ${t.f.join(', ')}</div>
            <div><b style="color:#38BDF8">Defense:</b> ${t.df.join(', ')}</div>
            ${ij.length ? `<div style="margin-top:6px;color:#FCA5A5"><b>Medical Report:</b> ${ij.map(x => `${x.p} (${x.s} - ${x.y})`).join(', ')}</div>` : ''}
        </div>
        <div class="g2">
            <button class="btn2" data-fav="${t.i}" style="margin:0">&#9733; ${FAV === t.i ? 'Pinned Favourite' : 'Pin as My Team'}</button>
            <button class="btn" data-simpair="${t.i}-${(t.i + 10) % 32}" style="margin:0">&#9889; Simulate Matchup</button>
        </div>
    `, 1);
}

function renderTicker() {
    const yest = GM.filter(g => g.d === DI - 1);
    const items = yest.map(g => {
        const A = T[g.a], H = T[g.h];
        return `<span class="tick-item" data-team="${g.ag > g.hg ? A.i : H.i}">
            <b style="color:${g.ag > g.hg ? '#10B981' : '#fff'}">${A.a} ${g.ag}</b>
            <span style="color:var(--mu)">@</span>
            <b style="color:${g.hg > g.ag ? '#10B981' : '#fff'}">${H.a} ${g.hg}</b>
            ${g.ot ? '<small style="color:#38BDF8;font-weight:800">OT</small>' : ''}
        </span>`;
    });
    // Add top PI leaders to ticker
    const top3 = T.map(t => t.i).sort((a, b) => RK(0, 'all')[a] - RK(0, 'all')[b]).slice(0, 3);
    top3.forEach((id, idx) => {
        items.push(`<span class="tick-item" data-team="${id}"><b style="color:#38BDF8">#${idx + 1} PI</b> ${T[id].a} (${f1(M[0][id].pi)})</span>`);
    });
    $('ticker').innerHTML = items.join('');
}

function sheet(h, b) {
    $('pn').innerHTML = h + (b === 0 ? '' : '<button class="btn2" data-x="1" style="margin-top:14px">Close Window</button>');
    $('sh').hidden = false;
}
const close = () => { $('sh').hidden = true };

function picker() {
    sheet(`<h3>Select Favourite NHL Franchise</h3><p class="sm">Pin your team for live briefings, priority game tracking, and custom dashboard metrics.</p><div class="pk">${[...T].sort((a, b) => a.n.localeCompare(b.n)).map(t => `<button class="${t.i === FAV ? 'sel' : ''}" data-fav="${t.i}">${lg(t, false)}<span>${t.n}</span></button>`).join('')}</div>`, 1);
}

function draw(top) {
    $('v').innerHTML = ({ home, ranks, standings, sim, rosters, games, inj })[tab]();
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab == tab));
    $('sb').innerHTML = `<span class="live-dot"></span> Day ${DI} &bull; ${dstr(DI)} &bull; 32 Franchises`;
    $('fav-btn-lbl').textContent = FAV != null ? `\u2605 ${T[FAV].a}` : '\u2605 My Team';
    renderTicker();
    if (top) window.scrollTo(0, 0);

    const srchInp = $('srch');
    if (srchInp) {
        srchInp.addEventListener('input', e => {
            searchQuery = e.target.value;
            draw(false);
            const newInp = $('srch');
            if (newInp) { newInp.focus(); newInp.setSelectionRange(newInp.value.length, newInp.value.length); }
        });
    }
    const selA = $('sel-sim-a'), selB = $('sel-sim-b');
    if (selA) selA.addEventListener('change', e => { simA = +e.target.value; simResult = null; draw(false); });
    if (selB) selB.addEventListener('change', e => { simB = +e.target.value; simResult = null; draw(false); });
}

document.addEventListener('click', e => {
    const b = e.target.closest('[data-i],[data-tab],[data-cat],[data-day],[data-pick],[data-fav],[data-x],[data-inj],[data-go],[data-stg],[data-stsort],[data-rfav],[data-team],[data-simpair],[data-simopt],[data-runsim],[data-simslate],[data-simall]');
    if (!b) return;
    const d = b.dataset;
    if (d.i) { e.stopPropagation(); const x = IN[d.i]; sheet(`<h3>${x[0]}</h3><p>${x[1]}</p>`, 1); }
    else if (d.team != null) { e.stopPropagation(); openTeamModal(+d.team); }
    else if (d.tab) { tab = d.tab; searchQuery = ''; draw(1); }
    else if (d.cat) { cat = d.cat; draw(); }
    else if (d.day != null) { gday = +d.day; draw(); }
    else if (d.pick) { picker(); }
    else if (d.fav != null) { FAV = +d.fav; try { localStorage.setItem('nhlfav', T[FAV].a); } catch (_) {} close(); tab = 'home'; draw(1); }
    else if (d.inj) { injF = d.inj; draw(); }
    else if (d.go != null) { tab = 'games'; gday = +d.go; draw(1); }
    else if (d.stg) { stGroup = d.stg; draw(); }
    else if (d.stsort) {
        if (stSort === d.stsort) stDir *= -1;
        else { stSort = d.stsort; stDir = -1; }
        draw(false);
    }
    else if (d.rfav) { rostFavOnly = !rostFavOnly; draw(); }
    else if (d.simpair) {
        const [a, bIdx] = d.simpair.split('-').map(Number);
        simA = a; simB = bIdx; simResult = null; close(); tab = 'sim'; draw(1);
    }
    else if (d.simopt) {
        if (d.simopt === 'home') simHomeB = true;
        else if (d.simopt === 'away') simHomeB = false;
        else if (d.simopt === 'inj') simInjActive = !simInjActive;
        simResult = null; draw(false);
    }
    else if (d.runsim) {
        simResult = runH2HSim(simA, simB, simHomeB, simInjActive);
        draw(false);
    }
    else if (d.simslate) {
        const g = sched(DI + gday).find(x => x.id === d.simslate);
        if (g) { slateSims[g.id] = sim(g, 0, Math.floor(Math.random() * 9999)); draw(false); }
    }
    else if (d.simall) {
        sched(DI + gday).forEach((g, idx) => { slateSims[g.id] = sim(g, idx, Math.floor(Math.random() * 9999)); });
        draw(false);
    }
    else if (d.x != null) { close(); }
});

document.addEventListener('keydown', e => { if (e.key == 'Escape') close(); });
draw();
</script>
</body>
</html>
