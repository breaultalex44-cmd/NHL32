<style>
:root {
    --bg: #04070F;
    --cd: rgba(11, 19, 43, 0.85);
    --tx: #E2E8F0;
    --mu: #94A3B8;
    --ln: rgba(56, 189, 248, 0.15);
    --ac: #38BDF8;
    --oa: #04070F;
    --up: #10B981;
    --dn: #EF4444;
    --hi: rgba(56, 189, 248, 0.1);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
    margin: 0;
    background-color: #04070F;
    background-image: 
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 24px 24px;
    color: var(--tx);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
a { color: var(--ac); text-decoration: none; }

/* Glassmorphism Panels */
.glass-panel {
    background: rgba(11, 19, 43, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: rgba(4, 7, 15, 0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.25);
}
.hi {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
}
h1 {
    font-size: 20px;
    margin: 0;
    flex: 1;
    line-height: 1.2;
    letter-spacing: -0.01em;
    font-weight: 800;
    color: #fff;
}
h1 small {
    display: block;
    font: 600 11px system-ui;
    color: var(--mu);
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
.ib {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(56, 189, 248, 0.4);
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.2));
    color: #38BDF8;
    font-size: 20px;
    display: grid;
    place-items: center;
    transition: all 0.2s;
}
.ib:hover { transform: scale(1.05); border-color: #38BDF8; }

#v {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 16px 100px;
    width: 100%;
}

nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    background: rgba(7, 12, 27, 0.95);
    backdrop-filter: blur(24px);
    border-top: 1px solid rgba(56, 189, 248, 0.2);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
}
nav button {
    flex: 1;
    min-height: 64px;
    background: none;
    border: 0;
    color: var(--mu);
    font: 600 11px system-ui;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: color 0.2s;
}
nav button span { font-size: 22px; line-height: 1; }
nav .on { color: #38BDF8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }

.c {
    background: rgba(11, 19, 43, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(56, 189, 248, 0.15);
    border-radius: 20px;
    padding: 18px;
    margin: 0 0 14px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
.c h2 { font-size: 17px; margin: 0 0 10px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
.sm { font-size: 13px; color: var(--mu); margin: 0 0 10px; }
.big { font-size: 24px; font-weight: 900; line-height: 1.1; color: #fff; }

.lg {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 800 11px system-ui;
    flex: none;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
}
.hero { border-left: 6px solid #38BDF8; }
.hh { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.fo {
    display: grid;
    place-items: center;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid;
    flex: none;
    background: rgba(0,0,0,0.3);
    box-shadow: 0 0 20px rgba(0,0,0,0.5);

.fo .lg { width: 50px; height: 50px; font-size: 15px; }
.hn { flex: 1; min-width: 0; }
.hn .sm { margin: 3px 0 0; }

.rb {

    border-radius: 14px;
    padding: 8px 12px;
    font-weight: 900;
    font-size: 26px;
    line-height: 1;
    text-align: center;

}
.rb small { display: block; font-size: 10px; font-weight: 700; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }

.g2, .g3 { display: grid; gap: 10px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }

.t {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(56, 189, 248, 0.1);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;

}
.t:hover { border-color: rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
.t b { display: block; font-size: 18px; color: #fff; font-weight: 800; }

.ch {

    border: 1px solid rgba(56, 189, 248, 0.2);

    line-height: 1.2;

.ch button small { display: block; font-size: 10px; font-weight: 500; opacity: 0.8; }

.btn, .btn2 {

    border: 0;

    align-items: center;
    justify-content: center;
    gap: 8px;

.btn2 {

    border: 1px solid rgba(56, 189, 248, 0.3);

.hd { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--mu); padding-bottom: 8px; border-bottom: 2px solid rgba(56, 189, 248, 0.3); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
.rw { border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.rw.fv { background: rgba(56, 189, 248, 0.08); border-radius: 12px; margin: 4px 0; border: 1px solid rgba(56, 189, 248, 0.3); }
.rw summary { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 6px 4px; list-style: none; cursor: pointer; color: var(--tx); font-weight: 500; }
.rw summary::-webkit-details-marker { display: none; }
.ex { padding: 8px 4px 14px; }
.rk { width: 28px; text-align: center; font-weight: 900; font-size: 17px; color: #fff; }
.nm { flex: 1; min-width: 0; }

.nm small { display: block; color: var(--mu); font-size: 11px; }
.v { min-width: 60px; text-align: right; font-weight: 900; font-size: 16px; color: #fff; }

.u { color: var(--up); } .d { color: var(--dn); } .z { color: var(--mu); }

.i {

    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid #38BDF8;
    background: none;
    color: #38BDF8;
    font: italic 700 11px/1 Georgia, serif;

    place-items: center;
    vertical-align: middle;
    margin-left: 6px;

.i:hover { background: #38BDF8; color: #04070F; }

.nw { padding: 12px 0; border-top: 1px solid rgba(56, 189, 248, 0.1); }

.tg { font: 800 11px system-ui; color: #38BDF8; text-transform: uppercase; letter-spacing: 0.05em; }

.nr { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }

.at { color: var(--mu); font-weight: 800; font-style: italic; }

.pr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.pr > b { width: 48px; text-align: center; font-weight: 900; color: #fff; }
.pb { flex: 1; height: 12px; display: flex; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(56, 189, 248, 0.2); }
.pb i { display: block; height: 100%; transition: width 0.5s ease; }
.pb i + i { border-left: 2px solid #04070F; }

.fvc { border-color: #38BDF8 !important; border-width: 2px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
details > summary { cursor: pointer; }
.gc > details > summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; color: #38BDF8; font-size: 13px; }
.why { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--mu); }
.why li { margin-bottom: 4px; }
.lu { border-top: 1px solid rgba(56, 189, 248, 0.1); padding: 10px 0; font-size: 13px; }
.lu > div > span { display: inline-block; width: 24px; font-weight: 900; color: #38BDF8; }
.lh { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; color: #fff; }

.ir { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.rt { text-align: right; }
.rt small { display: block; font-size: 11px; color: var(--mu); margin-top: 3px; }
.st { display: inline-block; padding: 3px 10px; border-radius: 12px; font: 800 11px system-ui; text-transform: uppercase; letter-spacing: 0.05em; }
.st.DTD { background: rgba(245, 158, 11, 0.2); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
.st.OUT { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
.st.IR { background: rgba(153, 27, 27, 0.4); color: #F87171; border: 1px solid rgba(153, 27, 27, 0.6); }

#sh { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
#sh[hidden] { display: none; }
.bk { position: absolute; inset: 0; background: rgba(4, 7, 15, 0.8); backdrop-filter: blur(8px); }
#pn {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: #0B132B;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 85%;
    overflow: auto;
    animation: up 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.8);
}
#pn h3 { margin: 0 0 8px; font-size: 20px; color: #fff; font-weight: 800; }
#pn p { margin: 0; font-size: 14px; color: var(--mu); line-height: 1.5; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.pk { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
@media(min-width: 480px) { .pk { grid-template-columns: repeat(3, 1fr); } }
.pk button {
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(56, 189, 248, 0.2);
    background: rgba(15, 23, 42, 0.6);
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    transition: all 0.2s;
    text-align: left;
}
.pk button:hover { background: rgba(56, 189, 248, 0.15); border-color: #38BDF8; transform: translateY(-2px); }
.pk .sel { outline: 2px solid #38BDF8; background: rgba(56, 189, 248, 0.2); }

:focus-visible { outline: 2px solid #38BDF8; outline-offset: 2px; }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
const RAW = `ANA|Anaheim:Ducks|#F47A38|2.8|3.2|20|77|Dostal,Husso|Terry,Carlsson,Zegras|LaCombe,Gudas

const T = RAW.split('\n').map((l, i) => {
    const p = l.split('|'), [c, k] = p[1].split(':');
    return { i, a: p[0], k, n: c + ' ' + k, c: p[2], o: +p[3], d: +p[4], pp: +p[5], pk: +p[6], g: p[7].split(','), f: p[8].split(','), df: p[9].split(','), tr: .8 + (i * 7 % 9) / 20 };

const R = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
const po = (l, r) => { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= r() } while (p > L); return k - 1 };

const D0 = Date.UTC(2026, 9, 7), now = new Date(), DI = Math.max(0, Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - D0) / 864e5));
const dstr = d => new Date(D0 + d * 864e5).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const TM = ['7:00', '7:30', '8:00', '10:00'], SC = {};

const sched = d => SC[d] || (SC[d] = (() => {
    const r = R(d * 7919 + 13), a = [...Array(32).keys()];
    for (let i = 31; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    const n = 3 + Math.floor(r() * 8), g = [];
    for (let i = 0; i < n; i++) g.push({ d, a: a[2 * i], h: a[2 * i + 1], tx: Math.floor(r() * 4) });
    return g;
})());

const sim = (g, j) => {
    const r = R(g.d * 104729 + j * 31 + 5), A = T[g.a], H = T[g.h];
    let ag = po(A.o * H.d / 3 * .98, r), hg = po(H.o * A.d / 3 * 1.03, r), ot = 0;
    if (ag == hg) { ot = 1; r() < .5 + (A.o - A.d - H.o + H.d) * .08 ? ag++ : hg++; }
    const pp = (x, y) => { const o = po(2.3 * y.tr, r); let s = 0; for (let i = 0; i < o; i++)if (r() < x.pp / 100 * (100 - y.pk) / 21) s++; return [o, s] };
    const [ao, ax] = pp(A, H), [ho, hx] = pp(H, A);
    return { d: g.d, a: g.a, h: g.h, ag, hg, ot, ao, ax: Math.min(ax, ag), ho, hx: Math.min(hx, hg), ap: 2 * ho + (r() < .4 ? 5 : 0), hp: 2 * ao + (r() < .4 ? 5 : 0), asf: Math.round(29 + (A.o - 3) * 6 + r() * 8 - 4), hsf: Math.round(30 + (H.o - 3) * 6 + r() * 8 - 4) }
};

const GM = [];
for (let d = 0; d < DI; d++)sched(d).forEach((g, j) => GM.push(sim(g, j)));

const ST = n => {
    const s = T.map(() => ({ gp: 0, w: 0, l: 0, ol: 0, gf: 0, ga: 0, ppg: 0, ppo: 0, pkg: 0, pko: 0, sf: 0, sa: 0, pim: 0 }));
    for (const g of GM) {
        if (g.d > n) break;
        const u = (i, gf, ga, po_, pg, ko, kg, sf, sa, pim) => { const x = s[i]; x.gp++; x.gf += gf; x.ga += ga; x.ppo += po_; x.ppg += pg; x.pko += ko; x.pkg += kg; x.sf += sf; x.sa += sa; x.pim += pim; gf > ga ? x.w++ : g.ot ? x.ol++ : x.l++ };
        u(g.a, g.ag, g.hg, g.ao, g.ax, g.ho, g.hx, g.asf, g.hsf, g.ap);
        u(g.h, g.hg, g.ag, g.ho, g.hx, g.ao, g.ax, g.hsf, g.asf, g.hp)
    }
    return s
};

const K = 8, MT = s => T.map((t, i) => {
    const a = s[i], g = a.gp, pts = 2 * a.w + a.ol, gf = (t.o * K + a.gf) / (K + g), ga = (t.d * K + a.ga) / (K + g), pp = (t.pp * 3 * K + 100 * a.ppg) / (3 * K + a.ppo), pk = (t.pk * 3 * K + 100 * (a.pko - a.pkg)) / (3 * K + a.pko), sv = 1 - (t.d * K + a.ga) / (29 * K + a.sa), sf = ((29.5 + (t.o - 3) * 6) * K + a.sf) / (K + g), pm = (6.6 * t.tr * K + a.pim) / (K + g), pq = (.5 + .17 * (t.o - t.d) * 1 + 0 * pts), pw = (pq * K + pts / 2) / (K + g);
    return { ...a, pts, gf, ga, pp, pk, sv, sf, pm, gd: a.gf - a.ga, pi: 50 + 40 * (pw - .5) + 10 * (gf - ga) + .3 * ((pp - 21) + (pk - 80)) }
});

const M = [MT(ST(DI - 1)), MT(ST(DI - 2)), MT(ST(DI - 3))];
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2), fp = v => v.toFixed(1) + '%';
const CA = {
    all: { l: 'Overall', k: 'pi', up: 1, f: f1, s: 'Power Index', i: 'PI', x: 'Every team ranked via the advanced Power Index metric.' },
    off: { l: 'Offence', k: 'gf', up: 1, f: f2, s: 'Goals/game', i: 'GF', x: 'Average goals scored per game.' },
    def: { l: 'Defence', k: 'ga', up: 0, f: f2, s: 'Against/game', i: 'GA', x: 'Average goals allowed per game.' },
    pp: { l: 'Power Play', k: 'pp', up: 1, f: fp, s: 'Power Play %', i: 'PP', x: 'Power play conversion efficiency.' },
    pk: { l: 'Penalty Kill', k: 'pk', up: 1, f: fp, s: 'Penalty Kill %', i: 'PK', x: 'Penalty kill success rate.' },
    gk: { l: 'Goalies', k: 'sv', up: 1, f: v => v.toFixed(3).slice(1), s: 'Save %', i: 'SV', x: 'Team goaltending save percentage.' },
    dis: { l: 'Discipline', k: 'pm', up: 0, f: f1, s: 'PIM/game', i: 'PIM', x: 'Fewest penalty minutes per game.' }
};

const RKc = {}, RK = (m, c) => RKc[m + c] || (RKc[m + c] = (() => {
    const { k, up } = CA[c], X = M[m], o = T.map(t => t.i).sort((x, y) => (up ? X[y][k] - X[x][k] : X[x][k] - X[y][k]) || X[y].pi - X[x].pi), r = [];
    o.forEach((t, p) => r[t] = p);
    return r
})());

const mv = (i, c, l) => RK(l, c)[i] - RK(0, c)[i];
const IT = ['Upper body', 'Lower body', 'Illness', 'Knee', 'Shoulder', 'Concussion', 'Hand', 'Ankle'];
const INJL = (() => {
    const w = Math.floor(DI / 5), L = [];
    T.forEach(t => [t.g[0], ...t.f, ...t.df].forEach((p, j) => {
        const r = R(w * 911 + t.i * 53 + j * 7 + 3);
        if (r() < .09) { const s = r(), y = IT[Math.floor(r() * IT.length)], k = s < .5 ? 'DTD' : s < .85 ? 'OUT' : 'IR'; L.push({ t: t.i, p, r: j ? j < 4 ? 'F' : 'D' : 'G', y, s: k, x: k == 'DTD' ? 'Day-to-day' : k == 'OUT' ? `About ${1 + Math.floor(r() * 3)} weeks` : `${4 + Math.floor(r() * 5)}+ weeks` }) }
    }));
    return L
})();

const IN = {
    PI: ['Power Index', 'A comprehensive 0-100 rating reflecting team strength blending points percentage, goal differential, and special teams efficiency.'],
    PTS: ['Points', '2 points for a win, 1 point for an OT/SO loss, 0 points for a regulation loss.'],
    REC: ['Record (W-L-OT)', 'Wins, regulation losses, and overtime/shootout losses.'],
    GP: ['Games Played', 'Total matches played in the regular season out of 82.'],
    GF: ['Goals For / Game', 'Average offensive output per contest.'],
    GA: ['Goals Against / Game', 'Average defensive concessions per contest.'],
    GD: ['Goal Differential', 'Net goal spread over the course of the season.'],
    PP: ['Power Play %', 'Man-advantage scoring conversion rate.'],
    PK: ['Penalty Kill %', 'Short-handed defensive efficiency rate.'],
    SV: ['Save Percentage', 'Combined goaltending save efficiency.'],
    SF: ['Shots For / Game', 'Offensive volume generated via shots on goal.'],
    PIM: ['Penalty Minutes / Game', 'Discipline metric tracking infractions.'],
    WIN: ['Win Probability', 'Statistical projection factoring Power Index, home-ice advantage, starting goaltenders, and active injuries.'],
    LU: ['Predicted Lineup', 'Projected skater combinations and starting goaltender based on rest, back-to-backs, and injury status.'],
    INJ: ['Injury Status', 'DTD (Game-time decision), OUT (Multi-week absence), IR (Long-term injured reserve).']

const info = k => `<button class="i" data-i="${k}" aria-label="What does ${k} mean?">i</button>`;
const tc = c => { const n = parseInt(c.slice(1), 16); return .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255) > 150 ? '#111' : '#fff' };
const lg = t => `<span class="lg" style="background:${t.c};color:${tc(t.c)}">${t.a}</span>`;
const rec = a => `${a.w}-${a.l}-${a.ol}`;
const ar = v => v > 0 ? `<b class="u">&#9650;${v}</b>` : v < 0 ? `<b class="d">&#9660;${-v}</b>` : '<b class="z">&ndash;</b>';

let FAV = null, tab = 'home', cat = 'all', gday = 0, injF = 'all';
try { const a = localStorage.getItem('nhlfav'), t = T.find(x => x.a == a); if (t) FAV = t.i } catch (_) {}
const isF = g => FAV != null && (g.a == FAV || g.h == FAV);
const nextG = f => { for (let k = 0; k < 10; k++) { const g = sched(DI + k).find(x => x.a == f || x.h == f); if (g) return { g, k } } };

function LU(i, d, op) {
    const t = T[i], ij = INJL.filter(x => x.t == i), out = n => ij.some(x => x.p == n && x.s != 'DTD'), dt = n => ij.some(x => x.p == n && x.s == 'DTD'),
        b2b = d > 0 && sched(d - 1).some(g => g.a == i || g.h == i), o = out(t.g[0]), bk = o || b2b, g = bk ? t.g[1] : t.g[0], sw = n => out(n) ? 'Call-up' : dt(n) ? n + '*' : n,
        f = t.f.map(sw), df = t.df.map(sw), lost = [...t.f, ...t.df].filter(out).length,
        ls = [...GM].reverse().find(x => x.a == i || x.h == i), won = ls && (ls.a == i ? ls.ag > ls.hg : ls.hg > ls.ag),
        hot = RK(0, 'pp')[op] < 8, off = RK(0, 'off')[op] < 8, ok = T[op].k;
    return {
        g, f, df, adj: (bk ? -4 : 0) - 2.5 * lost, tag: [bk ? 'backup goalie starting' : '', lost ? `${lost} key skater${lost > 1 ? 's' : ''} out` : ''].filter(Boolean).join(', '),
        why: [
            bk ? (o ? `${t.g[0]} is sidelined, so ${t.g[1]} gets the nod.` : `Second leg of a back-to-back sequence; ${t.g[1]} starts while ${t.g[0]} rests.`) : `${t.g[0]} starts in net: rested and confirmed.`,
            lost ? `${lost} key skater${lost > 1 ? 's are' : ' is'} out of the lineup.` : ij.some(x => x.s == 'DTD') ? `Day-to-day game-time decisions expected to play.` : `Full lineup health maintained.`,
            ls ? (won ? `Maintaining momentum following the previous victory.` : `Adjusting lines to bounce back from a loss.`) : `Pre-season depth charts active.`,
            hot ? `${ok} boast a top-8 power play; expect disciplined penalty kill deployment.` : off ? `${ok} feature a top-8 attack; top shutdown pair will match up.` : `Standard tactical deployment expected.`
        ]
    }
}

function pred(g) {
    const A = T[g.a], H = T[g.h], la = LU(g.a, g.d, g.h), lh = LU(g.h, g.d, g.a), a = M[0][g.a].pi, h = M[0][g.h].pi, p = 1 / (1 + Math.exp(-(h - a + 2.5 + lh.adj - la.adj) / 22));

    if (la.adj) why.push(`${A.k}: ${la.tag}.`);
    if (lh.adj) why.push(`${H.k}: ${lh.tag}.`);
    return { p, la, lh, why }
}

function news(f) {
    const t = T[f], m = M[0][f], o = [], ls = [...GM].reverse().find(g => g.a == f || g.h == f);
    if (ls) {
        const h = ls.h == f, a = h ? ls.hg : ls.ag, b = h ? ls.ag : ls.hg, p = T[h ? ls.a : ls.h], s = h ? ls.hsf : ls.asf, q = h ? ls.asf : ls.hsf, x = h ? ls.hx : ls.ax, n = h ? ls.ho : ls.ao;
        o.push(['Latest Result', `${t.k} ${a > b ? 'defeated' : 'fell to'} ${p.k} ${a}-${b}${ls.ot ? ' (OT)' : ''}`, `${dstr(ls.d)}. Shots ${s}-${q}, PP goals ${x} of ${n}.`])
    } else {
        o.push(['Season Status', 'Awaiting Opening Puck Drop', 'Pre-season power ratings active until initial results log.']);
    }

    const ng = nextG(f);
    if (ng) {
        const g = ng.g, aw = g.a == f, P = pred(g);
        o.push(['Upcoming Matchup', `${aw ? 'At' : vs = 'Vs'} ${T[aw ? g.h : g.a].k} — ${ng.k == 0 ? 'Today' : ng.k == 1 ? 'Tomorrow' : dstr(DI + ng.k)}`, `${Math.round((aw ? 1 - P.p : P.p) * 100)}% projected win probability. Projected starter: ${(aw ? P.la : P.lh).g}.`])
    }
    const rp = RK(0, 'pp')[f] + 1, rk = RK(0, 'pk')[f] + 1;
    o.push(['Special Teams', `PP #${rp} | PK #${rk}`, `Converting ${fp(m.pp)} on the power play and killing ${fp(m.pk)} penalties.`]);
    const ij = INJL.filter(x => x.t == f);

    return o
}

const tiles = i => {

function snap() {

    if (top) scrollTo(0, 0);
}

document.addEventListener('click', e => {
    const b = e.target.closest('[data-i],[data-tab],[data-cat],[data-day],[data-pick],[data-fav],[data-x],[data-inj],[data-go]');
    if (!b) return;
    const d = b.dataset;
    if (d.i) { const x = IN[d.i]; sheet(`<h3>${x[0]}</h3><p>${x[1]}</p>`, 1) }
    else if (d.tab) { tab = d.tab; draw(1) }
    else if (d.cat) { cat = d.cat; draw() }
    else if (d.day != null) { gday = +d.day; draw() }
    else if (d.pick) { picker() }
    else if (d.fav != null) { FAV = +d.fav; try { localStorage.setItem('nhlfav', T[FAV].a) } catch (_) {} close(); tab = 'home'; draw(1) }
    else if (d.inj) { injF = d.inj; draw() }
    else if (d.go != null) { tab = 'games'; gday = +d.go; draw(1) }
    else if (d.x != null) { close() }
});

document.addEventListener('keydown', e => { if (e.key == 'Escape') close() });
draw();
</script>
</body>
</html>
