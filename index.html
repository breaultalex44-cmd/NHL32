<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070F">
<title>NHL 32 Ultimate Intelligence Hub | Frost & Aurora Edition</title>
<style>
:root {
    --bg: #04070F;
    --cd: rgba(11, 19, 43, 0.84);
    --cd-solid: #0B132B;
    --tx: #F1F5F9;
    --mu: #94A3B8;
    --ln: rgba(56, 189, 248, 0.18);
    --ac: #38BDF8;
    --au: #10B981;
    --up: #10B981;
    --dn: #EF4444;
    --gd: #F59E0B;
    --pu: #8B5CF6;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
    margin: 0;
    background-color: var(--bg);
    color: var(--tx);
    font: 14px/1.45 var(--font-sans);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}

/* Aurora Borealis & Ice Rink Coordinate Backdrop */
.aurora-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse 80% 50% at 15% 8%, rgba(56, 189, 248, 0.14), transparent 60%),
        radial-gradient(ellipse 75% 50% at 85% 18%, rgba(16, 185, 129, 0.11), transparent 60%),
        radial-gradient(ellipse 65% 60% at 50% 92%, rgba(139, 92, 246, 0.09), transparent 65%),
        radial-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 24px 24px;
}

button, select, input {
    font: inherit;
    color: inherit;
}
button {
    touch-action: manipulation;
    cursor: pointer;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: #04070F; }
::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #38BDF8; }

/* Sticky Frost Header */
header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: rgba(4, 7, 15, 0.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(56, 189, 248, 0.25);
}
.hi {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
}
.brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: linear-gradient(135deg, #38BDF8 0%, #10B981 100%);
    color: #04070F;
    font-weight: 900;
    font-size: 12px;
    font-family: var(--font-mono);
    display: grid;
    place-items: center;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    flex: none;
}
h1 {
    font-size: 17px;
    margin: 0;
    flex: 1;
    min-width: 0;
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 900;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
h1 small {
    display: flex;
    align-items: center;
    gap: 6px;
    font: 600 10.5px var(--font-sans);
    color: var(--mu);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 2px;
}
.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10B981;
    box-shadow: 0 0 8px #10B981;
    flex: none;
    animation: pulseDot 1.8s infinite;
}
@keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
}

.ib {
    min-width: 40px;
    height: 38px;
    padding: 0 11px;
    border-radius: 99px;
    border: 1px solid rgba(56, 189, 248, 0.4);
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(16, 185, 129, 0.16));
    color: #38BDF8;
    font-size: 12px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex: none;
    transition: all 0.18s;
}
.ib:hover { border-color: #38BDF8; box-shadow: 0 0 14px rgba(56, 189, 248, 0.3); }

/* Live Broadcast Ticker */
.ticker-wrap {
    background: rgba(7, 13, 30, 0.92);
    border-bottom: 1px solid rgba(56, 189, 248, 0.16);
}
.ticker-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
}
.ticker-label {
    background: rgba(56, 189, 248, 0.18);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38BDF8;
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex: none;
}
.ticker-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    white-space: nowrap;
    font-size: 11.5px;
    color: #CBD5E1;
}
.ticker-scroll::-webkit-scrollbar { display: none; }
.tick-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(56, 189, 248, 0.15);
    padding: 3px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.18s;
}
.tick-item:hover { border-color: #38BDF8; }

/* Main Container */
#v {
    max-width: 920px;
    margin: 0 auto;
    padding: 14px 14px 104px;
    width: 100%;
}

/* Bottom Navigation (7 compact tabs optimized for 360px+ viewports) */
nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    background: rgba(5, 10, 22, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(56, 189, 248, 0.24);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.85);
}
.nav-inner {
    display: flex;
    width: 100%;
    max-width: 920px;
}
nav button {
    flex: 1;
    min-width: 0;
    min-height: 58px;
    padding: 4px 2px;
    background: none;
    border: 0;
    color: var(--mu);
    font: 700 10px var(--font-sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: color 0.18s;
    position: relative;
    overflow: hidden;
}
nav button span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}
nav button svg {
    width: 19px;
    height: 19px;
    stroke-width: 2.1;
    flex: none;
}
nav .on { color: #38BDF8; }
nav .on::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 3px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(90deg, #38BDF8, #10B981);
    box-shadow: 0 0 10px #38BDF8;
}

/* Glass Cards */
.c {
    background: var(--cd);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 18px;
    padding: 16px;
    margin: 0 0 14px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
}
.c h2 {
    font-size: 15.5px;
    margin: 0 0 10px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
}
.sm { font-size: 12.5px; color: var(--mu); margin: 0 0 10px; }
.big { font-size: 21px; font-weight: 900; line-height: 1.15; color: #fff; letter-spacing: -0.02em; }

/* Team Badges */
.lg {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font: 900 10.5px var(--font-mono);
    flex: none;
    border: 2px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    letter-spacing: -0.03em;
    cursor: pointer;
    transition: transform 0.16s;
}
.lg:hover { transform: scale(1.07); }
.t-name-hover { cursor: pointer; }
.t-name-hover:hover { color: #38BDF8; text-decoration: underline; text-underline-offset: 3px; }

/* Hero Card */
.hero { border-left: 5px solid #38BDF8; }
.hh { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.fo {
    display: grid;
    place-items: center;
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 3px solid;
    flex: none;
    background: rgba(4, 7, 15, 0.6);
    box-shadow: 0 0 22px rgba(0, 0, 0, 0.55);
    cursor: pointer;
}
.fo .lg { width: 48px; height: 48px; font-size: 14px; }
.hn { flex: 1; min-width: 0; }
.hn .sm { margin: 3px 0 0; }

.rb {
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    color: #04070F;
    border-radius: 13px;
    padding: 7px 11px;
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    text-align: center;
    flex: none;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
}
.rb small { display: block; font-size: 9px; font-weight: 800; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }

/* Grids & Stat Tiles */
.g2, .g3, .g4 { display: grid; gap: 9px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media(min-width: 540px) { .g4 { grid-template-columns: repeat(4, 1fr); } }

.t {
    background: rgba(15, 23, 42, 0.68);
    border: 1px solid rgba(56, 189, 248, 0.14);
    border-radius: 13px;
    padding: 9px 7px;
    text-align: center;
    transition: border-color 0.18s, transform 0.18s;
}
.t:hover { border-color: rgba(56, 189, 248, 0.42); transform: translateY(-1px); }
.t b { display: block; font-size: 16px; color: #fff; font-weight: 800; font-family: var(--font-mono); }
.t small { display: block; font-size: 10.5px; color: var(--mu); margin-top: 2px; }

/* Filter Chips & Buttons */
.ch {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 2px 0 11px;
    scrollbar-width: none;
}
.ch::-webkit-scrollbar { display: none; }
.ch button, .chip-btn {
    flex: none;
    min-height: 38px;
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid rgba(56, 189, 248, 0.24);
    background: rgba(11, 19, 43, 0.78);
    font-weight: 700;
    font-size: 12.5px;
    line-height: 1.2;
    color: var(--mu);
    transition: all 0.18s;
}
.ch button:hover, .chip-btn:hover { border-color: rgba(56, 189, 248, 0.52); color: #fff; }
.ch button small { display: block; font-size: 9.5px; font-weight: 600; opacity: 0.85; }
.ch .on, .chip-btn.on, .btn {
    background: linear-gradient(135deg, #38BDF8, #0284C7);
    color: #04070F;
    border-color: #38BDF8;
    font-weight: 800;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
}
.btn, .btn2 {
    min-height: 44px;
    padding: 0 16px;
    border-radius: 13px;
    border: 0;
    font-weight: 800;
    font-size: 13px;
    width: 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.18s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(56, 189, 248, 0.42); }
.btn2 {
    background: rgba(56, 189, 248, 0.15);
    color: #38BDF8;
    border: 1px solid rgba(56, 189, 248, 0.32);
}
.btn2:hover { background: rgba(56, 189, 248, 0.25); border-color: #38BDF8; }

/* Rankings Rows */
.hd {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    color: var(--mu);
    padding-bottom: 8px;
    border-bottom: 2px solid rgba(56, 189, 248, 0.28);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
}
.rw { border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.rw.fv {
    background: rgba(56, 189, 248, 0.09);
    border-radius: 13px;
    margin: 4px 0;
    border: 1px solid rgba(56, 189, 248, 0.36);
}
.rw summary {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 56px;
    padding: 6px 5px;
    list-style: none;
    cursor: pointer;
    color: var(--tx);
    font-weight: 500;
}
.rw summary::-webkit-details-marker { display: none; }
.ex { padding: 8px 5px 14px; }
.rk { width: 26px; text-align: center; font-weight: 900; font-size: 15px; color: #fff; font-family: var(--font-mono); flex: none; }
.nm { flex: 1; min-width: 0; }
.nm > b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 700; }
.nm small { display: block; color: var(--mu); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.v { min-width: 58px; text-align: right; font-weight: 900; font-size: 15px; color: #fff; font-family: var(--font-mono); flex: none; }
.ar { min-width: 34px; text-align: center; flex: none; }
.u { color: var(--up); } .d { color: var(--dn); } .z { color: var(--mu); }
.u, .d, .z { font-size: 11px; font-weight: 800; font-family: var(--font-mono); }

/* Percentile Bar */
.pct-bar-wrap {
    margin-bottom: 10px;
    background: rgba(15, 23, 42, 0.72);
    padding: 9px 12px;
    border-radius: 12px;
    border: 1px solid rgba(56, 189, 248, 0.15);
}
.pct-track { height: 7px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.pct-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #38BDF8, #10B981); }

/* Info Tooltip Trigger */
.i {
    position: relative;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid #38BDF8;
    background: none;
    color: #38BDF8;
    font: italic 700 10px/1 Georgia, serif;
    padding: 0;
    display: inline-grid;
    place-items: center;
    vertical-align: middle;
    margin-left: 4px;
    cursor: pointer;
    transition: all 0.16s;
}
.i:hover { background: #38BDF8; color: #04070F; }
.i::before { content: ""; position: absolute; inset: -9px; }

/* News Feed */
.nw { padding: 11px 0; border-top: 1px solid rgba(56, 189, 248, 0.1); }
.nw:first-of-type { border-top: 0; padding-top: 0; }
.nw b { display: block; font-size: 14px; margin: 2px 0 4px; color: #fff; }
.nw p { margin: 0; font-size: 12.5px; color: var(--mu); }
.tg { font: 800 10px var(--font-sans); color: #38BDF8; text-transform: uppercase; letter-spacing: 0.06em; }

/* Game Matchup Cards */
.nr { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.nr p { margin: 0; }
.gt { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--mu); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
.gm { display: flex; align-items: center; justify-content: space-around; margin: 6px 0 12px; gap: 6px; }
.tm { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 92px; text-align: center; }
.tm .lg { width: 46px; height: 46px; font-size: 12.5px; }
.tm b { color: #fff; font-size: 14.5px; }
.tm small { font-size: 10.5px; color: var(--mu); }
.at { color: var(--mu); font-weight: 800; font-style: italic; font-size: 12.5px; }

.score-pill {
    font-family: var(--font-mono);
    font-size: 23px;
    font-weight: 900;
    color: #fff;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(56, 189, 248, 0.28);
    padding: 6px 12px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.win-score { color: #10B981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.45); }

.pr { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.pr > b { width: 44px; text-align: center; font-weight: 900; color: #fff; font-family: var(--font-mono); font-size: 12.5px; }
.pb { flex: 1; height: 10px; display: flex; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(56, 189, 248, 0.22); }
.pb i { display: block; height: 100%; transition: width 0.45s ease; }
.pb i + i { border-left: 2px solid #04070F; }

.fvc { border-color: #38BDF8 !important; border-width: 2px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.22); }
details > summary { cursor: pointer; }
.gc > details > summary { min-height: 38px; display: flex; align-items: center; font-weight: 700; color: #38BDF8; font-size: 12.5px; margin-top: 6px; }
.why { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--mu); }
.why li { margin-bottom: 4px; }
.lu { border-top: 1px solid rgba(56, 189, 248, 0.12); padding: 10px 0; font-size: 12.5px; }
.lu > div > span { display: inline-block; width: 22px; font-weight: 900; color: #38BDF8; font-family: var(--font-mono); }
.lh { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-weight: 700; color: #fff; }

/* Injury Rows */
.ir { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid rgba(56, 189, 248, 0.1); }
.ir:last-child { border-bottom: 0; }
.rt { text-align: right; flex: none; }
.rt small { display: block; font-size: 10.5px; color: var(--mu); margin-top: 3px; }
.st { display: inline-block; padding: 3px 8px; border-radius: 99px; font: 800 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; }
.st.DTD { background: rgba(245, 158, 11, 0.18); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
.st.OUT { background: rgba(239, 68, 68, 0.18); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
.st.IR { background: rgba(153, 27, 27, 0.38); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.55); }

/* Playoff Berth Badges */
.po-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 5px;
    margin-left: 5px;
}
.po-x { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.45); }
.po-wc { background: rgba(56, 189, 248, 0.2); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.45); }
.cutline-row td { border-bottom: 2px dashed rgba(16, 185, 129, 0.55) !important; }

/* Inputs & Controls */
.ctrl-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 11px;
    flex-wrap: wrap;
}
.search-inp {
    flex: 1;
    min-width: 170px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(56, 189, 248, 0.32);
    border-radius: 12px;
    padding: 9px 12px;
    color: #fff;
    font-size: 13px;
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
}
.search-inp:focus { border-color: #38BDF8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.28); }
.sel-box {
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(56, 189, 248, 0.34);
    border-radius: 12px;
    padding: 9px 11px;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    outline: none;
    width: 100%;
}
.sel-box:focus { border-color: #38BDF8; }

/* Standings Table */
.tbl-wrap { overflow-x: auto; margin-top: 8px; border-radius: 13px; border: 1px solid rgba(56, 189, 248, 0.18); }
.st-tbl { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
.st-tbl th {
    background: rgba(7, 13, 30, 0.96);
    color: var(--mu);
    font-weight: 800;
    padding: 9px 7px;
    text-transform: uppercase;
    font-size: 10px;
    border-bottom: 2px solid rgba(56, 189, 248, 0.28);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}
.st-tbl th:hover { color: #38BDF8; }
.st-tbl td { padding: 8px 7px; border-bottom: 1px solid rgba(56, 189, 248, 0.08); font-family: var(--font-mono); white-space: nowrap; }
.st-tbl tr:hover { background: rgba(56, 189, 248, 0.06); }

<script>
(function() {
    "use strict";

    const $ = id => document.getElementById(id);

    // Safe Storage Wrapper for Sandboxed Environments
    const Store = {
        get(k) {
            try { return window.localStorage.getItem(k); } catch (e) { return null; }
        },
        set(k, v) {
            try { window.localStorage.setItem(k, v); } catch (e) {}
        }
    };

    const RAW = [
        "ANA|Anaheim:Ducks|#F47A38|2.8|3.2|20|77|Dostal,Husso|Terry,Carlsson,Zegras|LaCombe,Gudas|Pacific|Western",
        "BOS|Boston:Bruins|#FFB81C|2.8|3.1|21|79|Swayman,Korpisalo|Pastrnak,Geekie,Lindholm|McAvoy,Lohrei|Atlantic|Eastern",
        "BUF|Buffalo:Sabres|#2A5CAA|3.0|3.1|21|78|Luukkonen,Levi|Thompson,Peterka,Norris|Dahlin,Power|Atlantic|Eastern",
        "CGY|Calgary:Flames|#D2282E|2.8|2.9|19|81|Wolf,Vladar|Kadri,Coronato,Huberdeau|Hanley,Weegar|Pacific|Western",
        "CAR|Carolina:Hurricanes|#CC0000|3.2|2.6|25|83|Andersen,Kochetkov|Aho,Stankoven,Svechnikov|Slavin,Chatfield|Metropolitan|Eastern",
        "CHI|Chicago:Blackhawks|#CF0A2C|2.6|3.3|18|78|Soderblom,Mrazek|Bedard,Hall,Donato|Levshunov,Rinzel|Central|Western",
        "COL|Colorado:Avalanche|#8A2D4D|3.4|3.0|24|79|Blackwood,Wedgewood|MacKinnon,Necas,Nelson|Makar,Toews|Central|Western",
        "CBJ|Columbus:Blue Jackets|#285BA6|3.1|3.2|22|77|Merzlikins,Greaves|Johnson,Fantilli,Marchenko|Werenski,Severson|Metropolitan|Eastern",
        "DAL|Dallas:Stars|#006847|3.2|2.7|22|82|Oettinger,DeSmith|Robertson,Hintz,Rantanen|Heiskanen,Lindell|Central|Western",
        "DET|Detroit:Red Wings|#CE1126|3.0|3.1|21|79|Gibson,Talbot|Raymond,Larkin,Kane|Seider,Edvinsson|Atlantic|Eastern",
        "EDM|Edmonton:Oilers|#FF4C00|3.2|2.9|26|80|Skinner,Pickard|McDavid,Draisaitl,Hyman|Bouchard,Ekholm|Pacific|Western",
        "FLA|Florida:Panthers|#C8102E|3.1|2.7|22|80|Bobrovsky,Tarasov|Barkov,Reinhart,Tkachuk|Ekblad,Forsling|Atlantic|Eastern",
        "LAK|Los Angeles:Kings|#A2AAAD|2.8|2.7|19|82|Kuemper,Forsberg|Kopitar,Kempe,Fiala|Doughty,Anderson|Pacific|Western",
        "MIN|Minnesota:Wild|#1E6B4E|3.0|2.8|20|81|Gustavsson,Wallstedt|Kaprizov,Boldy,Hartman|Faber,Spurgeon|Central|Western",
        "MTL|Montreal:Canadiens|#AF1E2D|3.0|3.1|20|79|Montembeault,Dobes|Suzuki,Caufield,Demidov|Hutson,Guhle|Atlantic|Eastern",
        "NSH|Nashville:Predators|#FFB81C|2.9|3.1|20|79|Saros,Annunen|Stamkos,O'Reilly,Marchessault|Josi,Carrier|Central|Western",
        "NJD|New Jersey:Devils|#CE1126|3.0|3.0|21|80|Markstrom,Jacobs|Hughes,Hischier,Meier|Hamilton,Siegenthaler|Metropolitan|Eastern",
        "NYI|New York:Islanders|#2F7FD0|2.7|3.0|18|80|Sorokin,Rittich|Barzal,Horvat,Lee|Pulock,Romanov|Metropolitan|Eastern",
        "NYR|New York:Rangers|#1F56C4|3.0|3.0|21|80|Shesterkin,Quick|Panarin,Zibanejad,Lafreniere|Fox,Miller|Metropolitan|Eastern",
        "OTT|Ottawa:Senators|#C52032|3.1|3.0|23|79|Ullmark,Forsberg|Tkachuk,Stutzle,Batherson|Chabot,Sanderson|Atlantic|Eastern",
        "PHI|Philadelphia:Flyers|#F74902|2.8|3.2|19|79|Fedotov,Ersson|Michkov,Konecny,Tippett|Sanheim,Seeler|Metropolitan|Eastern",
        "PIT|Pittsburgh:Penguins|#FCB514|2.8|3.3|20|77|Silovs,Blomqvist|Crosby,Malkin,Rakell|Karlsson,Letang|Metropolitan|Eastern",
        "SJS|San Jose:Sharks|#006D75|2.5|3.5|18|77|Askarov,Nedeljkovic|Celebrini,Smith,Eklund|Ferraro,Thrun|Pacific|Western",
        "SEA|Seattle:Kraken|#68A2B9|2.8|3.2|19|78|Grubauer,Daccord|Schwartz,Wright,Beniers|Larsson,Dunn|Pacific|Western",
        "STL|St. Louis:Blues|#2F5FC0|2.9|3.0|19|80|Binnington,Hofer|Thomas,Kyrou,Schenn|Parayko,Faulk|Central|Western",
        "TBL|Tampa Bay:Lightning|#1E4FB0|3.3|2.8|24|80|Vasilevskiy,Johansson|Kucherov,Point,Guentzel|Hedman,McDonagh|Atlantic|Eastern",
        "TOR|Toronto:Maple Leafs|#1F4DAA|3.2|2.9|23|80|Stolarz,Woll|Matthews,Nylander,Tavares|Rielly,McCabe|Atlantic|Eastern",
        "UTA|Utah:Mammoth|#6CACE4|3.0|3.0|21|80|Vejmelka,Ingram|Keller,Cooley,Guenther|Sergachev,Durzi|Central|Western",
        "VAN|Vancouver:Canucks|#00843D|2.9|3.0|21|80|Demko,Lankinen|Pettersson,Miller,Boeser|Hughes,Hronek|Pacific|Western",
        "VGK|Vegas:Golden Knights|#B4975A|3.3|2.8|22|82|Hill,Schmid|Eichel,Marner,Stone|Pietrangelo,Theodore|Pacific|Western",
        "WSH|Washington:Capitals|#C8102E|3.3|2.8|22|80|Thompson,Lindgren|Ovechkin,Strome,Wilson|Carlson,Fehervary|Metropolitan|Eastern",
        "WPG|Winnipeg:Jets|#3A5F9E|3.3|2.4|24|82|Hellebuyck,Comrie|Scheifele,Connor,Ehlers|Morrissey,Pionk|Central|Western"
    ];

    const T = RAW.map((l, i) => {
        const p = l.split("|");
        const parts = p[1].split(":");
        return {
            i,
            a: p[0],
            k: parts[1],
            n: parts[0] + " " + parts[1],
            c: p[2],
            o: +p[3],
            d: +p[4],
            pp: +p[5],
            pk: +p[6],
            g: p[7].split(","),
            f: p[8].split(","),
            df: p[9].split(","),
            div: p[10],
            conf: p[11],
            tr: 0.8 + ((i * 7) % 9) / 20
        };
    });

    // Deterministic Mulberry32 PRNG & Poisson Variate Generator
    const R = s => () => {
        s |= 0;
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    const po = (l, r) => {
        const lam = Math.max(0.05, l);
        const L = Math.exp(-lam);
        let k = 0, p = 1;
        do {
            k++;
            p *= r();
        } while (p > L && k < 25);
        return k - 1;
    };

    // Season Calendar Anchor (Oct 7, 2026) with Minimum 3 Simulated Days Guard
    const D0 = Date.UTC(2026, 9, 7);
    const now = new Date();
    const rawDays = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - D0) / 864e5);
    const DI = Math.max(3, Math.min(185, rawDays));
    const dstr = d => new Date(D0 + d * 864e5).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
    const TM = ["7:00", "7:30", "8:00", "10:00"];
    const SC = {};

    const sched = d => {
        const day = Math.max(0, d);
        if (SC[day]) return SC[day];
        const r = R(day * 7919 + 13);
        const a = Array.from({ length: 32 }, (_, idx) => idx);
        for (let i = 31; i > 0; i--) {
            const j = Math.floor(r() * (i + 1));
            const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        const n = 4 + Math.floor(r() * 7);
        const g = [];
        for (let i = 0; i < n; i++) {
            g.push({ d: day, a: a[2 * i], h: a[2 * i + 1], tx: Math.floor(r() * 4), id: day + "-" + i });
        }
        SC[day] = g;
        return g;
    };

    const sim = (g, j, seedOffset = 0) => {
        const r = R(g.d * 104729 + j * 31 + 5 + seedOffset);
        const A = T[g.a], H = T[g.h];
        let ag = po((A.o * H.d / 3) * 0.98, r);
        let hg = po((H.o * A.d / 3) * 1.03, r);
        let ot = 0;
        if (ag === hg) {
            ot = 1;
            const pAway = 0.5 + (A.o - A.d - H.o + H.d) * 0.08;
            if (r() < Math.min(0.85, Math.max(0.15, pAway))) ag++;
            else hg++;
        }
        const pp = (x, y) => {
            const o = po(2.3 * y.tr, r);
            let s = 0;
            for (let i = 0; i < o; i++) {
                if (r() < (x.pp / 100) * ((100 - y.pk) / 21)) s++;
            }
            return [o, s];
        };
        const [ao, ax] = pp(A, H);
        const [ho, hx] = pp(H, A);
        return {
            d: g.d, a: g.a, h: g.h, ag, hg, ot,
            ao, ax: Math.min(ax, ag),
            ho, hx: Math.min(hx, hg),
            ap: 2 * ho + (r() < 0.4 ? 5 : 0),
            hp: 2 * ao + (r() < 0.4 ? 5 : 0),
            asf: Math.max(ag + 12, Math.round(29 + (A.o - 3) * 6 + r() * 8 - 4)),
            hsf: Math.max(hg + 12, Math.round(30 + (H.o - 3) * 6 + r() * 8 - 4))
        };
    };

    const GM = [];
    for (let d = 0; d < DI; d++) {
        sched(d).forEach((g, j) => GM.push(sim(g, j)));
    }

    const ST = n => {
        const limit = Math.max(0, n);
        const s = T.map(() => ({ gp: 0, w: 0, l: 0, ol: 0, gf: 0, ga: 0, ppg: 0, ppo: 0, pkg: 0, pko: 0, sf: 0, sa: 0, pim: 0 }));
        for (const g of GM) {
            if (g.d > limit) break;
            const u = (i, gf, ga, po_, pg, ko, kg, sf, sa, pim) => {
                const x = s[i];
                x.gp++; x.gf += gf; x.ga += ga;
                x.ppo += po_; x.ppg += pg; x.pko += ko; x.pkg += kg;
                x.sf += sf; x.sa += sa; x.pim += pim;
                if (gf > ga) x.w++;
                else if (g.ot) x.ol++;
                else x.l++;
            };
            u(g.a, g.ag, g.hg, g.ao, g.ax, g.ho, g.hx, g.asf, g.hsf, g.ap);
            u(g.h, g.hg, g.ag, g.ho, g.hx, g.ao, g.ax, g.hsf, g.asf, g.hp);
        }
        return s;
    };

    const K = 8;
    const MT = s => T.map((t, i) => {
        const a = s[i], g = a.gp, pts = 2 * a.w + a.ol;
        const gf = (t.o * K + a.gf) / (K + g);
        const ga = (t.d * K + a.ga) / (K + g);
        const pp = (t.pp * 3 * K + 100 * a.ppg) / (3 * K + a.ppo);
        const pk = (t.pk * 3 * K + 100 * (a.pko - a.pkg)) / (3 * K + a.pko);
        const sv = 1 - (t.d * K + a.ga) / (29 * K + a.sa);
        const sf = ((29.5 + (t.o - 3) * 6) * K + a.sf) / (K + g);
        const pm = (6.6 * t.tr * K + a.pim) / (K + g);
        const pq = 0.5 + 0.17 * (t.o - t.d);
        const pw = (pq * K + pts / 2) / (K + g);
        return {
            ...a,
            pts,
            gf,
            ga,
            pp,
            pk,
            sv,
            sf,
            pm,
            gd: a.gf - a.ga,
            pi: 50 + 40 * (pw - 0.5) + 10 * (gf - ga) + 0.3 * ((pp - 21) + (pk - 80))
        };
    });

    const M = [MT(ST(DI - 1)), MT(ST(DI - 2)), MT(ST(DI - 3))];
    const f1 = v => Number(v).toFixed(1);
    const f2 = v => Number(v).toFixed(2);
    const fp = v => Number(v).toFixed(1) + "%";

    const CA = {
        all: { l: "Overall", k: "pi", up: 1, f: f1, s: "Power Index", i: "PI", x: "Comprehensive 0-100 rating blending points rate, goal diff, and special teams." },
        off: { l: "Offence", k: "gf", up: 1, f: f2, s: "Goals/Game", i: "GF", x: "Adjusted average goals scored per game." },
        def: { l: "Defence", k: "ga", up: 0, f: f2, s: "Against/Game", i: "GA", x: "Adjusted average goals allowed per game." },
        pp: { l: "Power Play", k: "pp", up: 1, f: fp, s: "Power Play %", i: "PP", x: "Man-advantage conversion efficiency." },
        pk: { l: "Penalty Kill", k: "pk", up: 1, f: fp, s: "Penalty Kill %", i: "PK", x: "Short-handed defensive kill efficiency." },
        gk: { l: "Goalies", k: "sv", up: 1, f: v => Number(v).toFixed(3).slice(1), s: "Save %", i: "SV", x: "Combined goaltending save percentage." },
        dis: { l: "Discipline", k: "pm", up: 0, f: f1, s: "PIM/Game", i: "PIM", x: "Fewest penalty minutes assessed per game." }
    };

    const RKc = {};
    const RK = (m, c) => {
        const key = m + "_" + c;
        if (RKc[key]) return RKc[key];
        const { k, up } = CA[c];
        const X = M[m] || M[0];
        const o = T.map(t => t.i).sort((x, y) => (up ? X[y][k] - X[x][k] : X[x][k] - X[y][k]) || (X[y].pi - X[x].pi));
        const r = [];
        o.forEach((t, p) => { r[t] = p; });
        RKc[key] = r;
        return r;
    };

    const mv = (i, c, l) => RK(l, c)[i] - RK(0, c)[i];

    // Medical & Injury Simulation
    const IT = ["Upper body", "Lower body", "Illness", "Knee", "Shoulder", "Concussion", "Hand", "Ankle"];
    const INJL = (() => {
        const w = Math.floor(DI / 5);
        const L = [];
        T.forEach(t => {
            [t.g[0], ...t.f, ...t.df].forEach((p, j) => {
                const r = R(w * 911 + t.i * 53 + j * 7 + 3);
                if (r() < 0.095) {
                    const s = r();
                    const y = IT[Math.floor(r() * IT.length)];
                    const k = s < 0.5 ? "DTD" : s < 0.85 ? "OUT" : "IR";
                    L.push({
                        t: t.i,
                        p,
                        r: j === 0 ? "G" : j < 4 ? "F" : "D",
                        y,
                        s: k,
                        x: k === "DTD" ? "Day-to-day" : k === "OUT" ? `About ${1 + Math.floor(r() * 3)} weeks` : `${4 + Math.floor(r() * 5)}+ weeks`
                    });
                }
            });
        });
        return L;
    })();

    // Deterministic Player Season Stats Derived from Simulated Team Output
    function playerStats(teamIdx, name, role, slotIdx) {
        const m = M[0][teamIdx];
        const isOut = INJL.some(x => x.t === teamIdx && x.p === name && x.s !== "DTD");
        const gp = Math.max(1, m.gp - (isOut ? Math.min(m.gp - 1, 3) : 0));
        const r = R(teamIdx * 313 + slotIdx * 97 + 19);
        if (role === "G") {
            const share = slotIdx === 0 ? 0.68 : 0.32;
            const gGp = Math.max(1, Math.round(gp * share));
            const gW = Math.min(gGp, Math.max(0, Math.round(m.w * share + (r() - 0.4))));
            const gaa = Math.max(1.85, m.ga + (slotIdx === 0 ? -0.14 : 0.22) + (r() - 0.5) * 0.25);
            const svp = Math.min(0.938, Math.max(0.882, m.sv + (slotIdx === 0 ? 0.005 : -0.007) + (r() - 0.5) * 0.008));
            return { gp: gGp, w: gW, gaa: gaa.toFixed(2), svp: svp.toFixed(3).slice(1) };
        }
        const mult = role === "F" ? ([1.28, 1.08, 0.94][slotIdx] || 0.9) : ([0.85, 0.62][slotIdx] || 0.6);
        const basePtsRate = (m.gf / 3.0) * mult * (0.9 + r() * 0.25);
        const pts = Math.max(1, Math.round(gp * basePtsRate));
        const gRatio = role === "F" ? (0.38 + r() * 0.14) : (0.20 + r() * 0.10);
        const goals = Math.min(pts, Math.round(pts * gRatio));
        const assists = pts - goals;
        return { gp, g: goals, a: assists, pts };
    }

    const IN = {
        PI: ["Power Index", "A comprehensive 0-100 rating reflecting true team strength by blending points percentage, adjusted goal differential, and special teams efficiency."],
        PTS: ["Points", "2 points for a win, 1 point for an OT/SO loss, 0 points for a regulation loss."],
        REC: ["Record (W-L-OT)", "Wins, regulation losses, and overtime/shootout losses."],
        GP: ["Games Played", "Total regular-season matches completed out of 82."],
        GF: ["Goals For / Game", "Adjusted offensive output per contest."],
        GA: ["Goals Against / Game", "Adjusted defensive concessions per contest."],
        GD: ["Goal Differential", "Net goal spread (Total GF minus Total GA) over the season."],
        PP: ["Power Play %", "Man-advantage scoring conversion rate."],
        PK: ["Penalty Kill %", "Short-handed defensive efficiency rate."],
        SV: ["Save Percentage", "Combined goaltending save efficiency."],
        SF: ["Shots For / Game", "Offensive shot volume generated per 60 minutes."],
        PIM: ["Penalty Minutes / Game", "Discipline metric tracking average infractions per game."],
        WIN: ["Win Probability", "Logistic projection factoring Power Index gap, home-ice advantage (+2.5 PI), starting goaltenders, and active injuries."],
        LU: ["Predicted Lineup", "Projected top skater units and starting goaltender factoring rest, back-to-backs, and injury reports."],
        INJ: ["Injury Status", "DTD (Day-to-day / Game-time decision), OUT (Multi-week absence), IR (Long-term injured reserve)."]
    };

    const info = k => `<button type="button" class="i" data-i="${k}" aria-label="What does ${k} mean?">i</button>`;
    const tc = c => {
        const n = parseInt(c.slice(1), 16);
        return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 150 ? "#111" : "#fff";
    };
    const lg = (t, clickable = true) => `<span class="lg" ${clickable ? `data-team="${t.i}" title="Inspect ${t.n}"` : ""} style="background:linear-gradient(135deg, ${t.c}, ${t.c}cc);color:${tc(t.c)}">${t.a}</span>`;
    const rec = a => `${a.w}-${a.l}-${a.ol}`;
    const ar = v => v > 0 ? `<b class="u">&#9650;${v}</b>` : v < 0 ? `<b class="d">&#9660;${-v}</b>` : `<b class="z">&ndash;</b>`;

    // Global Application State
    let FAV = null;
    let tab = "home";
    let cat = "all";
    let gday = 0;
    let injF = "all";
    let injStatus = "all";
    let stGroup = "league";
    let stSort = "pts";
    let stAsc = false;
    let searchQuery = "";
    let rostFavOnly = false;
    let simAway = 10;
    let simHome = 26;
    let simIncludeInj = true;
    let simResult = null;
    let quickSims = {};

    const savedFav = Store.get("nhlfav");
    if (savedFav) {
        const found = T.find(x => x.a === savedFav);
        if (found) {
            FAV = found.i;
            simAway = found.i;
            simHome = (found.i + 16) % 32;
        }
    }

    const isF = g => FAV != null && (g.a === FAV || g.h === FAV);
    const nextG = f => {
        for (let k = 0; k < 10; k++) {
            const g = sched(DI + k).find(x => x.a === f || x.h === f);
            if (g) return { g, k };
        }
        return null;
    };

    function LU(i, d, op, ignoreInj = false) {
        const t = T[i];
        const ij = ignoreInj ? [] : INJL.filter(x => x.t === i);
        const out = n => ij.some(x => x.p === n && x.s !== "DTD");
        const dt = n => ij.some(x => x.p === n && x.s === "DTD");
        const b2b = d > 0 && sched(d - 1).some(g => g.a === i || g.h === i);
        const o = out(t.g[0]);
        const bk = o || b2b;
        const g = bk ? t.g[1] : t.g[0];
        const sw = n => out(n) ? "Call-up" : dt(n) ? n + "*" : n;
        const f = t.f.map(sw);
        const df = t.df.map(sw);
        const lost = [...t.f, ...t.df].filter(out).length;
        const ls = [...GM].reverse().find(x => x.a === i || x.h === i);
        const won = ls && (ls.a === i ? ls.ag > ls.hg : ls.hg > ls.ag);
        const hot = RK(0, "pp")[op] < 8;
        const off = RK(0, "off")[op] < 8;
        const ok = T[op].k;

        return {
            g,
            f,
            df,
            adj: (bk ? -4 : 0) - 2.5 * lost,
            tag: [bk ? "backup goalie starting" : "", lost ? `${lost} key skater${lost > 1 ? "s" : ""} out` : ""].filter(Boolean).join(", "),
            why: [
                bk ? (o ? `${t.g[0]} is sidelined, so ${t.g[1]} gets the crease.` : `Second night of a back-to-back; ${t.g[1]} starts while ${t.g[0]} rests.`) : `${t.g[0]} starts in net: rested and confirmed.`,
                lost ? `${lost} key skater${lost > 1 ? "s are" : " is"} out of the lineup.` : ij.some(x => x.s === "DTD") ? "Day-to-day game-time decisions expected to dress." : "Full lineup health maintained.",
                ls ? (won ? "Carrying momentum following previous victory." : "Adjusting line combinations after last defeat.") : "Opening depth charts active.",
                hot ? `${ok} boast a top-8 power play; disciplined penalty kill deployment is critical.` : off ? `${ok} feature a top-8 offence; top shutdown pair will match up.` : "Balanced four-line tactical deployment expected."
            ]
        };
    }

    function pred(g, ignoreInj = false) {
        const A = T[g.a], H = T[g.h];
        const la = LU(g.a, g.d, g.h, ignoreInj);
        const lh = LU(g.h, g.d, g.a, ignoreInj);
        const a = M[0][g.a].pi;
        const h = M[0][g.h].pi;
        const p = 1 / (1 + Math.exp(-(h - a + 2.5 + lh.adj - la.adj) / 22));
        const why = [
            `${(h >= a ? H : A).k} hold the Power Index edge (${f1(Math.max(a, h))} vs ${f1(Math.min(a, h))}).`,
            `Home-ice advantage (+2.5 PI) factored for ${H.k}.`
        ];
        if (la.adj) why.push(`${A.k}: ${la.tag}.`);
        if (lh.adj) why.push(`${H.k}: ${lh.tag}.`);
        return { p, la, lh, why };
    }

    function news(f) {
        const t = T[f], m = M[0][f], o = [];
        const ls = [...GM].reverse().find(g => g.a === f || g.h === f);
        if (ls) {
            const h = ls.h === f;
            const a = h ? ls.hg : ls.ag;
            const b = h ? ls.ag : ls.hg;
            const p = T[h ? ls.a : ls.h];
            const s = h ? ls.hsf : ls.asf;
            const q = h ? ls.asf : ls.hsf;
            const x = h ? ls.hx : ls.ax;
            const n = h ? ls.ho : ls.ao;
            o.push(["Latest Result", `${t.k} ${a > b ? "defeated" : "fell to"} ${p.k} ${a}-${b}${ls.ot ? " (OT)" : ""}`, `${dstr(ls.d)}. Shots ${s}-${q}, PP goals ${x} of ${n}.`]);
        } else {
            o.push(["Season Status", "Awaiting Opening Puck Drop", "Pre-season power ratings active until initial results log."]);
        }
        const m2 = mv(f, "all", 2), r = RK(0, "all")[f] + 1;
        o.push(["Power Ranking", m2 > 0 ? `Climbed ${m2} spot${m2 > 1 ? "s" : ""} to #${r}` : m2 < 0 ? `Slipped ${-m2} spot${m2 < -1 ? "s" : ""} to #${r}` : `Holding firm at #${r} overall`, `Power Index rating stands at ${f1(m.pi)} (${rec(m)}, ${m.pts} pts).`]);
        const ng = nextG(f);
        if (ng) {
            const g = ng.g, aw = g.a === f, P = pred(g);
            o.push(["Upcoming Matchup", `${aw ? "At" : "Vs"} ${T[aw ? g.h : g.a].k} — ${ng.k === 0 ? "Today" : ng.k === 1 ? "Tomorrow" : dstr(DI + ng.k)}`, `${Math.round((aw ? 1 - P.p : P.p) * 100)}% projected win probability. Projected starter: ${(aw ? P.la : P.lh).g}.`]);
        }
        const rp = RK(0, "pp")[f] + 1, rk = RK(0, "pk")[f] + 1;
        o.push(["Special Teams", `PP #${rp} | PK #${rk}`, `Converting ${fp(m.pp)} on the power play and killing ${fp(m.pk)} penalties.`]);
        const ij = INJL.filter(x => x.t === f);
        if (ij.length) {
            o.push(["Injury Report", `${ij.length} player${ij.length > 1 ? "s" : ""} sidelined`, ij.map(x => `${x.p} (${x.y}, ${x.s})`).join(". ") + "."]);
        }
        return o;
    }

    const tiles = i => {
        const m = M[0][i];
        return [
            ["PTS", "Points", m.pts],
            ["REC", "W-L-OT", rec(m)],
            ["GP", "Games", m.gp],
            ["GF", "Goals/Game", f2(m.gf)],
            ["GA", "Against/Game", f2(m.ga)],
            ["GD", "Goal Diff", (m.gd > 0 ? "+" : "") + m.gd],
            ["PP", "Power Play", fp(m.pp)],
            ["PK", "Penalty Kill", fp(m.pk)],
            ["SV", "Save %", m.sv.toFixed(3).slice(1)],
            ["SF", "Shots/Game", f1(m.sf)],
            ["PIM", "PIM/Game", f1(m.pm)],
            ["PI", "Power Index", f1(m.pi)]
        ].map(([k, l, v]) => `<div class="t"><b>${v}</b><small>${l}${info(k)}</small></div>`).join("");
    };

    const row = (i, c) => {
        const t = T[i], m = M[0][i], C = CA[c], rank = RK(0, c)[i] + 1;
        const pct = Math.round(((32 - rank) / 31) * 100);
        return `<details class="rw${i === FAV ? " fv" : ""}">
            <summary>
                <span class="rk">${rank}</span>
                ${lg(t)}
                <span class="nm"><b>${t.n}</b><small>${rec(m)} &bull; ${m.pts} pts &bull; 2D: ${ar(mv(i, c, 2))}</small></span>
                <span class="ar">${ar(mv(i, c, 1))}</span>
                <span class="v">${C.f(m[C.k])}</span>
            </summary>
            <div class="ex">
                <div class="pct-bar-wrap">
                    <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#CBD5E1">
                        <span>${C.l} League Percentile</span>
                        <span style="color:#38BDF8">${pct}th Percentile (#${rank} of 32)</span>
                    </div>
                    <div class="pct-track"><div class="pct-fill" style="width:${Math.max(5, pct)}%"></div></div>
                </div>
                <div class="g3">${tiles(i)}</div>
                <button type="button" class="btn2" data-team="${i}">Open Full Franchise Intelligence Profile</button>
            </div>
        </details>`;
    };

    function snap() {
        const o = T.map(t => t.i).sort((a, b) => RK(0, "all")[a] - RK(0, "all")[b]).slice(0, 5);
        const d2 = T.map(t => mv(t.i, "all", 2));
        const mx = Math.max(...d2);
        const u = d2.indexOf(mx);
        return `<div class="c">
            <h2><span>League Elite (Top 5 Power Index)</span><button type="button" class="chip-btn" data-tab="sim" style="min-height:30px;padding:4px 11px;font-size:11px">&#9889; Sim Lab</button></h2>
            ${o.map(i => row(i, "all")).join("")}
            <p class="sm" style="margin-top:10px">${mx > 0 ? `Biggest 2-Day Mover: <b>${T[u].n}</b> ${ar(mx)}.` : "League hierarchy steady over the past 48 hours."}</p>
        </div>`;
    }

    function home() {
        if (FAV == null) {
            return `<div class="c" style="text-align:center;padding:28px 16px;border-color:rgba(56,189,248,0.42)">
                <div class="big" style="margin-bottom:8px">Welcome to NHL 32 Ultimate Hub</div>
                <p class="sm" style="max-width:440px;margin:0 auto 16px">Pin your favourite NHL franchise for live win probability projections, dynamic line combinations, injury tracking, and tailored intelligence briefings.</p>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                    <button type="button" class="btn" data-pick="1" style="max-width:210px;margin:0">&#9733; Select Favourite Team</button>
                    <button type="button" class="btn2" data-tab="sim" style="max-width:210px;margin:0">&#9889; Launch Sim Lab</button>
                </div>
            </div>` + snap();
        }
        const t = T[FAV], m = M[0][FAV], r = RK(0, "all")[FAV] + 1, ng = nextG(FAV);
        const tl = [["off", "GF"], ["def", "GA"], ["pp", "PP"], ["pk", "PK"]].map(([c, k]) =>
            `<div class="t"><b>#${RK(0, c)[FAV] + 1}</b><small>${CA[c].l}${info(k)}</small><small style="color:#38BDF8;font-weight:700">${CA[c].f(m[CA[c].k])}</small></div>`
        ).join("");

        let nx = "";
        if (ng) {
            const g = ng.g, aw = g.a === FAV, o = T[aw ? g.h : g.a], P = pred(g);
            const w = Math.round((aw ? 1 - P.p : P.p) * 100);
            const l = aw ? P.la : P.lh;
            nx = `<div class="c">
                <h2><span>Next Fixture</span><span class="tg">${ng.k === 0 ? "TONIGHT" : ng.k === 1 ? "TOMORROW" : dstr(DI + ng.k)}</span></h2>
                <div class="nr">${lg(o)}<div><b class="t-name-hover" data-team="${o.i}">${aw ? "At" : "Vs"} ${o.n}</b><p class="sm">${TM[g.tx]} PM ET &bull; Projected Starter: <b style="color:#fff">${l.g}</b></p></div></div>
                <div class="pr"><b>${w}%</b><div class="pb"><i style="width:${w}%;background:${t.c}"></i><i style="width:${100 - w}%;background:${o.c}"></i></div><b>${100 - w}%</b></div>
                <p class="sm" style="text-align:center">Projected Win Probability ${info("WIN")}</p>
                <div class="g2">
                    ${ng.k < 3 ? `<button type="button" class="btn2" data-go="${ng.k}" style="margin:0">Inspect Lineups</button>` : `<button type="button" class="btn2" data-tab="games" style="margin:0">Full Schedule</button>`}
                    <button type="button" class="btn" data-simpair="${g.a}-${g.h}" style="margin:0">&#9889; Open in Sim Lab</button>
                </div>
            </div>`;
        }

        return `<div class="c hero" style="border-left-color:${t.c}">
            <div class="hh">
                <span class="fo" style="border-color:${t.c}" data-team="${t.i}">${lg(t, false)}</span>
                <div class="hn">
                    <div class="big t-name-hover" data-team="${t.i}">${t.n}</div>
                    <p class="sm">${t.conf} &bull; ${t.div} &bull; <b>${rec(m)}</b> (${m.pts} PTS)</p>
                </div>
                <div class="rb">#${r}<small>Power Rk</small></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
                <p class="sm" style="margin:0">Power Index: <b style="color:#fff">${f1(m.pi)}</b> ${info("PI")} &bull; 1D: ${ar(mv(FAV, "all", 1))} &bull; 2D: ${ar(mv(FAV, "all", 2))}</p>
                <button type="button" class="chip-btn" data-team="${t.i}" style="min-height:28px;padding:3px 10px;font-size:11px">Deep-Dive Profile &rarr;</button>
            </div>
            <div class="g4" style="margin-top:11px">${tl}</div>
        </div>` + nx + `<div class="c"><h2>Intelligence Briefings</h2>${news(FAV).map(n => `<article class="nw"><span class="tg">${n[0]}</span><b>${n[1]}</b><p>${n[2]}</p></article>`).join("")}</div>` + snap();
    }

    function ranks() {
        const C = CA[cat], rk = RK(0, cat);
        const q = searchQuery.trim().toLowerCase();
        const o = T.map(t => t.i)
            .filter(i => !q || T[i].n.toLowerCase().includes(q) || T[i].a.toLowerCase().includes(q))
            .sort((a, b) => rk[a] - rk[b]);
        return `<div class="ctrl-bar">
            <input type="text" id="srch" placeholder="Filter 32 franchises..." class="search-inp" value="${searchQuery.replace(/"/g, "&quot;")}">
            <button type="button" class="chip-btn" data-tab="sim">&#9889; H2H Sim</button>
        </div>
        <div class="ch">${Object.keys(CA).map(k => `<button type="button" class="${k === cat ? "on" : ""}" data-cat="${k}">${CA[k].l}</button>`).join("")}</div>
        <p class="sm">${C.x} Tap any franchise row for league percentiles & 12-metric breakdown.</p>
        <div class="c"><div class="hd"><span>Rank & Franchise</span><span>${C.s}${info(C.i)}</span></div>${o.map(i => row(i, cat)).join("")}</div>`;
    }

    // Playoff Qualification Badges (Divisional Top 3 + Wild Card 1 & 2 per Conference)
    function getPlayoffBadges() {
        const badges = {};
        ["Eastern", "Western"].forEach(conf => {
            const confTeams = T.filter(t => t.conf === conf).map(t => t.i);
            const divs = conf === "Eastern" ? ["Atlantic", "Metropolitan"] : ["Central", "Pacific"];
            const divTop3 = new Set();
            divs.forEach(d => {
                const dTeams = confTeams
                    .filter(i => T[i].div === d)
                    .sort((a, b) => M[0][b].pts - M[0][a].pts || M[0][b].w - M[0][a].w || M[0][b].gd - M[0][a].gd);
                dTeams.slice(0, 3).forEach((id, idx) => {
                    divTop3.add(id);
                    badges[id] = "D" + (idx + 1);
                });
            });
            const wcPool = confTeams
                .filter(i => !divTop3.has(i))
                .sort((a, b) => M[0][b].pts - M[0][a].pts || M[0][b].w - M[0][a].w || M[0][b].gd - M[0][a].gd);
            if (wcPool[0] != null) badges[wcPool[0]] = "WC1";
            if (wcPool[1] != null) badges[wcPool[1]] = "WC2";
        });
        return badges;
    }

    function standingsTable(teamIndices, badges, showCutlineAt = -1, fixedOrder = false) {
        const sorted = fixedOrder ? teamIndices.slice() : teamIndices.slice().sort((a, b) => {
            const ma = M[0][a], mb = M[0][b];
            const va = ma[stSort], vb = mb[stSort];
            if (va !== vb) return stAsc ? (va - vb) : (vb - va);
            return mb.pts - ma.pts || mb.w - ma.w || mb.gd - ma.gd;
        });
        const th = (k, lbl) => `<th data-stsort="${k}">${lbl}${!fixedOrder && stSort === k ? (stAsc ? " &#9652;" : " &#9662;") : ""}</th>`;
        return `<div class="tbl-wrap"><table class="st-tbl"><thead><tr>
            <th>#</th>
            <th style="text-align:left">Team</th>
            ${th("gp", "GP")}
            ${th("w", "W")}
            ${th("l", "L")}
            ${th("ol", "OTL")}
            ${th("pts", "PTS")}
            ${th("gf", "GF/G")}
            ${th("ga", "GA/G")}
            ${th("gd", "DIFF")}
            ${th("pi", "PI")}
        </tr></thead><tbody>${sorted.map((i, r) => {
            const t = T[i], m = M[0][i], b = badges[i];
            const bHtml = b ? `<span class="po-badge ${b.startsWith("WC") ? "po-wc" : "po-x"}">${b}</span>` : "";
            const isCut = showCutlineAt > 0 && r === showCutlineAt - 1 && (fixedOrder || (stSort === "pts" && !stAsc));
            return `<tr class="${i === FAV ? "rw fv " : ""}${isCut ? "cutline-row" : ""}">
                <td><b>${r + 1}</b></td>
                <td><div class="t-cell">${lg(t)}<span data-team="${t.i}" class="t-name-hover">${t.k}</span>${bHtml}</div></td>
                <td>${m.gp}</td>
                <td><b>${m.w}</b></td>
                <td>${m.l}</td>
                <td>${m.ol}</td>
                <td><b style="color:#38BDF8;font-size:13px">${m.pts}</b></td>
                <td>${f2(m.gf)}</td>
                <td>${f2(m.ga)}</td>
                <td style="color:${m.gd > 0 ? "#10B981" : m.gd < 0 ? "#EF4444" : "#94A3B8"}">${m.gd > 0 ? "+" + m.gd : m.gd}</td>
                <td>${f1(m.pi)}</td>
            </tr>`;
        }).join("")}</tbody></table></div>`;
    }

    function standings() {
        const badges = getPlayoffBadges();
        let content = "";
        if (stGroup === "league") {
            content = standingsTable(T.map(t => t.i), badges, 16);
        } else if (stGroup === "conf") {

    // Head-to-Head Matchup Lab & Full Game Simulator
    function runH2HSim(awayIdx, homeIdx, useInj) {
        const A = T[awayIdx], H = T[homeIdx];
        const gObj = { d: DI, a: awayIdx, h: homeIdx };
        const P = pred(gObj, !useInj);
        const seed = Math.floor(Math.random() * 999999) + 17;
        const r = R(seed);

        const pHome = P.p;
        const pAway = 1 - pHome;
        const expA = (A.o * H.d / 3) * 0.98 * Math.pow(pAway / 0.5, 0.22);
        const expH = (H.o * A.d / 3) * 1.03 * Math.pow(pHome / 0.5, 0.22);

        const pA = [po(expA / 3, r), po(expA / 3, r), po(expA / 3, r)];
        const pH = [po(expH / 3, r), po(expH / 3, r), po(expH / 3, r)];
        let totA = pA[0] + pA[1] + pA[2];
        let totH = pH[0] + pH[1] + pH[2];
        let otLabel = "";

        if (totA === totH) {
            otLabel = r() < 0.65 ? "OT" : "SO";
            if (r() < pAway) {
                totA++; pA.push(1); pH.push(0);
            } else {
                totH++; pA.push(0); pH.push(1);
            }
        }

        const shotsA = Math.max(totA + 14, Math.round(28 + (A.o - 3) * 6 + r() * 10 - 5));
        const shotsH = Math.max(totH + 14, Math.round(29 + (H.o - 3) * 6 + r() * 10 - 5));
        const ppoA = po(2.5, r) + 1;
        const ppoH = po(2.5, r) + 1;
        const ppgA = Math.min(totA, po(0.65, r));
        const ppgH = Math.min(totH, po(0.65, r));

        const awayWon = totA > totH;
        const winT = awayWon ? A : H;
        const loseT = awayWon ? H : A;
        const winG = awayWon ? totA : totH;
        const loseG = awayWon ? totH : totA;
        const winShotsAgainst = awayWon ? shotsH : shotsA;
        const saves = Math.max(12, winShotsAgainst - loseG);
        const svPct = ((saves / Math.max(saves + loseG, 1)) * 100).toFixed(1);

        const stars = [
            { rank: "1st Star", name: winT.f[0], team: winT.a, stat: `${Math.min(3, Math.max(1, Math.ceil(winG / 2)))}G, ${Math.floor(r() * 2) + 1}A` },
            { rank: "2nd Star", name: (awayWon ? P.la : P.lh).g, team: winT.a, stat: `${saves} Saves (${svPct}%)` },
            { rank: "3rd Star", name: loseT.f[0], team: loseT.a, stat: `${Math.min(2, loseG)}G, ${Math.floor(r() * 5) + 3} SOG` }
        ];

        return {
            awayIdx,
            homeIdx,
            pA,
            pH,
            totA,
            totH,
            otLabel,
            shotsA,
            shotsH,
            ppA: `${ppgA}/${ppoA}`,
            ppH: `${ppgH}/${ppoH}`,
            stars
        };
    }

        const q = searchQuery.trim().toLowerCase();

            return true;
        }).sort((a, b) => o[a.s] - o[b.s] || T[a.t].a.localeCompare(T[b.t].a));

        return `<div class="ctrl-bar"><input type="text" id="srch" placeholder="Search injured players or teams..." class="search-inp" value="${searchQuery.replace(/"/g, "&quot;")}"></div>
        <div class="ch">
            <button type="button" class="${injF === "all" ? "on" : ""}" data-inj="all">All 32 Teams (${INJL.length})</button>
            <button type="button" class="${injF === "fav" ? "on" : ""}" data-inj="fav">My Team</button>
            <button type="button" class="${injStatus === "all" ? "on" : ""}" data-injst="all">All Status</button>
            <button type="button" class="${injStatus === "IR" ? "on" : ""}" data-injst="IR">IR</button>
            <button type="button" class="${injStatus === "OUT" ? "on" : ""}" data-injst="OUT">OUT</button>
            <button type="button" class="${injStatus === "DTD" ? "on" : ""}" data-injst="DTD">DTD</button>
        </div>
        <p class="sm">Active NHL medical & IR tracker ${info("INJ")}. All absences automatically adjust predicted lineups and win probabilities.</p>
        <div class="c">${injF === "fav" && FAV == null ? `<p class="sm" style="text-align:center;padding:16px">Select your favourite team via the top star button to filter medical reports.</p>` : L.map(x => `<div class="ir">${lg(T[x.t])}<div class="nm"><b>${x.p}</b><small>${x.r === "G" ? "Goaltender" : x.r === "F" ? "Forward" : "Defenseman"} &bull; ${T[x.t].n} &bull; ${x.y}</small><small style="color:#38BDF8">${ef[x.r]}</small></div><div class="rt"><span class="st ${x.s}">${x.s}</span><small>${x.x}</small></div></div>`).join("") || `<p class="sm" style="text-align:center;padding:16px">No active injuries matching current filters.</p>`}</div>`;
    }

    // Team Deep-Dive Modal Profile
    function openTeamModal(teamIdx) {
        const t = T[teamIdx], m = M[0][teamIdx], rkAll = RK(0, "all")[teamIdx] + 1;
        const recent = GM.filter(g => g.a === teamIdx || g.h === teamIdx).slice(-5).reverse();
        const upcoming = [];
        for (let k = 0; k < 10 && upcoming.length < 3; k++) {
            const g = sched(DI + k).find(x => x.a === teamIdx || x.h === teamIdx);
            if (g) upcoming.push({ g, k });
        }
        const ij = INJL.filter(x => x.t === teamIdx);

        const formHtml = recent.map(g => {
            const isH = g.h === teamIdx;
            const gf = isH ? g.hg : g.ag;
            const ga = isH ? g.ag : g.hg;
            const res = gf > ga ? "W" : g.ot ? "OTL" : "L";
            const opp = T[isH ? g.a : g.h];
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 9px;background:rgba(15,23,42,0.75);border-radius:10px;margin-bottom:5px;font-size:12px">
                <span style="display:flex;align-items:center;gap:7px"><span class="fpill ${res}">${res}</span><b>${isH ? "vs" : "@"} ${opp.k}</b></span>
                <span style="font-family:var(--font-mono);font-weight:800;color:#fff">${gf}-${ga}${g.ot ? " (OT)" : ""} <small style="color:var(--mu);font-weight:500">${dstr(g.d)}</small></span>
            </div>`;
        }).join("");

        const upHtml = upcoming.map(({ g, k }) => {
            const aw = g.a === teamIdx;
            const opp = T[aw ? g.h : g.a];
            const P = pred(g);
            const wp = Math.round((aw ? 1 - P.p : P.p) * 100);
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 9px;background:rgba(15,23,42,0.75);border-radius:10px;margin-bottom:5px;font-size:12px">
                <span><b>${aw ? "@" : "vs"} ${opp.k}</b> <small style="color:var(--mu)">(${k === 0 ? "Today" : dstr(DI + k)})</small></span>
                <span style="font-family:var(--font-mono);font-weight:800;color:#38BDF8">${wp}% Win</span>
            </div>`;
        }).join("");

        sheet(`
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:13px">
                <span class="fo" style="width:58px;height:58px;border-color:${t.c}">${lg(t, false)}</span>
                <div style="flex:1;min-width:0">
                    <h3 style="margin:0">${t.n}</h3>
                    <p style="font-size:12px;margin:2px 0 0">${t.conf} &bull; ${t.div} &bull; Power Rank <b>#${rkAll}</b> &bull; <b>${rec(m)}</b> (${m.pts} PTS)</p>
                </div>
            </div>
            <div class="g4" style="margin-bottom:13px">${tiles(teamIdx)}</div>
            <div class="g2" style="margin-bottom:11px">
                <div>
                    <div style="font-size:10.5px;font-weight:800;color:#38BDF8;text-transform:uppercase;margin-bottom:5px">Last 5 Results</div>
                    ${formHtml || `<p class="sm">No games logged yet.</p>`}
                </div>
                <div>
                    <div style="font-size:10.5px;font-weight:800;color:#38BDF8;text-transform:uppercase;margin-bottom:5px">Next 3 Fixtures</div>
                    ${upHtml}
                </div>
            </div>
            <div style="background:rgba(15,23,42,0.7);border:1px solid rgba(56,189,248,0.18);border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:11px">
                <div style="font-weight:800;color:#fff;margin-bottom:4px">Core Depth Chart</div>
                <div><b style="color:#38BDF8">Goalies:</b> ${t.g.join(", ")}</div>
                <div><b style="color:#38BDF8">Forwards:</b> ${t.f.join(", ")}</div>
                <div><b style="color:#38BDF8">Defense:</b> ${t.df.join(", ")}</div>
                ${ij.length ? `<div style="margin-top:6px;color:#FCA5A5"><b>Medical Report:</b> ${ij.map(x => `${x.p} (${x.s} - ${x.y})`).join(", ")}</div>` : ""}
            </div>
            <div class="g2">
                <button type="button" class="btn2" data-fav="${t.i}" style="margin:0">&#9733; ${FAV === t.i ? "Pinned Favourite" : "Set as My Team"}</button>
                <button type="button" class="btn" data-simpair="${t.i}-${(t.i + 10) % 32}" style="margin:0">&#9889; Open in Sim Lab</button>
            </div>
        `, 1);
    }

    function renderTicker() {
        const yest = GM.filter(g => g.d === DI - 1);
        const items = yest.map(g => {
            const A = T[g.a], H = T[g.h];
            const winId = g.ag > g.hg ? A.i : H.i;
            return `<span class="tick-item" data-team="${winId}">
                <b style="color:${g.ag > g.hg ? "#10B981" : "#fff"}">${A.a} ${g.ag}</b>
                <span style="color:var(--mu)">@</span>
                <b style="color:${g.hg > g.ag ? "#10B981" : "#fff"}">${H.a} ${g.hg}</b>
                ${g.ot ? `<small style="color:#38BDF8;font-weight:800">OT</small>` : ""}
            </span>`;
        });
        const top3 = T.map(t => t.i).sort((a, b) => RK(0, "all")[a] - RK(0, "all")[b]).slice(0, 3);
        top3.forEach((id, idx) => {
            items.push(`<span class="tick-item" data-team="${id}"><b style="color:#38BDF8">#${idx + 1} PI</b> ${T[id].a} (${f1(M[0][id].pi)})</span>`);
        });
        $("ticker").innerHTML = items.join("");
    }

    function sheet(h, b) {
        $("pn").innerHTML = h + (b === 0 ? "" : `<button type="button" class="btn2" data-x="1" style="margin-top:12px">Close Window</button>`);
        $("sh").hidden = false;
    }

    const close = () => { $("sh").hidden = true; };

    function picker() {
        const sorted = [...T].sort((a, b) => a.n.localeCompare(b.n));
        sheet(`<h3>Select Favourite NHL Franchise</h3><p class="sm">Pin your team for live briefings, priority game tracking, and custom dashboard metrics.</p><div class="pk">${sorted.map(t => `<button type="button" class="${t.i === FAV ? "sel" : ""}" data-fav="${t.i}">${lg(t, false)}<span>${t.n}</span></button>`).join("")}</div>`, 1);
    }

    function draw(top) {
        const views = { home, ranks, standings, rosters, games, sim: simView, inj };
        const renderer = views[tab] || home;
        $("v").innerHTML = renderer();
        document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
        $("sb").innerHTML = `<span class="live-dot"></span> ${dstr(DI)} &bull; Day ${DI}`;
        $("fav-btn-lbl").textContent = FAV != null ? `\u2605 ${T[FAV].a}` : "\u2605 My Team";
        renderTicker();
        if (top) window.scrollTo(0, 0);

        const srchInp = $("srch");
        if (srchInp) {
            srchInp.addEventListener("input", e => {
                searchQuery = e.target.value;
                draw(false);
                const newInp = $("srch");
                if (newInp) {
                    newInp.focus();
                    const len = newInp.value.length;
                    newInp.setSelectionRange(len, len);
                }
            });
        }
        const selAway = $("sel-sim-away");
        const selHome = $("sel-sim-home");
        if (selAway) {
            selAway.addEventListener("change", e => {
                simAway = +e.target.value;
                simResult = null;
                draw(false);
            });
        }
        if (selHome) {
            selHome.addEventListener("change", e => {
                simHome = +e.target.value;
                simResult = null;
                draw(false);
            });
        }
    }

    document.addEventListener("click", e => {
        const b = e.target.closest("[data-i],[data-tab],[data-cat],[data-day],[data-pick],[data-fav],[data-x],[data-inj],[data-injst],[data-go],[data-stg],[data-stsort],[data-rfav],[data-team],[data-simpair],[data-simopt],[data-runsim],[data-simslate],[data-simall]");
        if (!b) return;
        const d = b.dataset;
        if (d.i) {
            e.stopPropagation();
            const x = IN[d.i];
            if (x) sheet(`<h3>${x[0]}</h3><p>${x[1]}</p>`, 1);
        } else if (d.team != null) {
            e.stopPropagation();
            openTeamModal(+d.team);
        } else if (d.tab) {
            tab = d.tab;
            searchQuery = "";
            draw(true);
        } else if (d.cat) {
            cat = d.cat;
            draw(false);
        } else if (d.day != null) {
            gday = +d.day;
            draw(false);
        } else if (d.pick) {
            picker();
        } else if (d.fav != null) {
            FAV = +d.fav;
            Store.set("nhlfav", T[FAV].a);
            close();
            tab = "home";
            draw(true);
        } else if (d.inj) {
            injF = d.inj;
            draw(false);
        } else if (d.injst) {
            injStatus = d.injst;
            draw(false);
        } else if (d.go != null) {
            tab = "games";
            gday = +d.go;
            draw(true);
        } else if (d.stg) {
            stGroup = d.stg;
            draw(false);
        } else if (d.stsort) {
            if (stSort === d.stsort) stAsc = !stAsc;
            else { stSort = d.stsort; stAsc = false; }
            draw(false);
        } else if (d.rfav) {
            rostFavOnly = !rostFavOnly;
            draw(false);
        } else if (d.simpair) {
            const parts = d.simpair.split("-").map(Number);
            simAway = parts[0];
            simHome = parts[1];
            simResult = null;
            close();
            tab = "sim";
            draw(true);
        } else if (d.simopt) {
            if (d.simopt === "swap") {
                const tmp = simAway; simAway = simHome; simHome = tmp;
            } else if (d.simopt === "inj") {
                simIncludeInj = !simIncludeInj;
            }
            simResult = null;
            draw(false);
        } else if (d.runsim) {
            simResult = runH2HSim(simAway, simHome, simIncludeInj);
            draw(false);
        } else if (d.simslate) {
            const g = sched(Math.max(0, DI + gday)).find(x => x.id === d.simslate);
            if (g) {
                quickSims[g.id] = sim(g, 0, Math.floor(Math.random() * 99999) + 1);
                draw(false);
            }
        } else if (d.simall) {
            sched(Math.max(0, DI + gday)).forEach((g, idx) => {
                quickSims[g.id] = sim(g, idx, Math.floor(Math.random() * 99999) + 1);
            });
            draw(false);
        } else if (d.x != null) {
            close();
        }
    });

    document.addEventListener("keydown", e => {
        if (e.key === "Escape") close();
    });

    draw(false);
})();
</script>
</body>
</html>
